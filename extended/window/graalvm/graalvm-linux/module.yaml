product: jvm/lib

dependencies:
  - ../../common
  # Annotations and C interop types for @CFunction and @CEntryPoint. The native-image
  # builder supplies them at image build time, so they are not bundled.
  - org.graalvm.sdk:nativeimage:25.0.1: compile-only
  # The scene's WindowSurface, which MetalWindowSurface/GlWindowSurface implement, and Skia
  # through it. Compiled against only: an application that hosts a scene depends on the scene
  # module itself, and one that only opens a window never loads the surface.
  - ../../scene: compile-only
  # Skia's classes, which a compile-only module does not pass on. The application's own
  # skiko-awt is the one it runs with.
  - org.jetbrains.skiko:skiko-awt:0.144.6: compile-only

test-dependencies:
  - $kotlin.test

settings:
  jvm:
    jdk:
      version: 21
    # Java 17 (major 61): the D-Bus connection's java.net.UnixDomainSocketAddress is Java 16, and
    # GraalVM ships only on LTS JDKs, so 17 is the lowest this module allows (the SDK itself is
    # major 55). central_bundle.py's CLASS_MAJOR_EXCEPTIONS lets this module, alone, carry 61.
    release: 17
  publishing:
    enabled: true
    group: org.thisisthepy.compose.window
    artifactId: graalvm-linux
    version: 1.11.1-ext.4

repositories:
  - id: mavenLocal
    url: mavenLocal
    publish: true
