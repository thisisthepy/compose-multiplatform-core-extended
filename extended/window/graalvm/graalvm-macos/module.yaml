# The AppKit window for the GraalVM native-image path: the Kotlin side of
# native/appkit_window.m. It declares the C entry points with @CFunction, reads the event
# queue the window fills and registers the generated upcall table. It names no toolkit
# type, so it compiles with no AWT on the path.

product:
  type: jvm/lib

dependencies:
  # Annotations and C interop types. Supplied by the native-image builder at image build
  # time, so they are not bundled into the jar.
  - ../../common
  - org.graalvm.sdk:nativeimage:25.0.1: compile-only
  # The scene's WindowSurface, which MetalWindowSurface/GlWindowSurface implement, and Skia
  # through it. Compiled against only: an application that hosts a scene depends on the scene
  # module itself, and one that only opens a window never loads the surface.
  - ../../scene: compile-only
  # Skia's classes, which a compile-only module does not pass on. The application's own
  # skiko-awt is the one it runs with.
  - org.jetbrains.skiko:skiko-awt:0.144.6: compile-only

test-dependencies:
  - $kotlin.test

settings:
  publishing:
    enabled: true
    group: org.thisisthepy.compose.window
    artifactId: graalvm-macos
    version: 1.11.1-ext.1

repositories:
  - id: mavenLocal
    url: mavenLocal
    publish: true
