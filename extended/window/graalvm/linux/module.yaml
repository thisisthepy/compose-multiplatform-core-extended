product: jvm/lib

dependencies:
  - ../../common
  # Annotations and C interop types for @CFunction and @CEntryPoint. The native-image
  # builder supplies them at image build time, so they are not bundled.
  - org.graalvm.sdk:nativeimage:25.0.1: compile-only

test-dependencies:
  - $kotlin.test

settings:
  publishing:
    enabled: true
    group: org.thisisthepy.compose.window
    artifactId: graalvm-linux
    version: 0.1.0

repositories:
  - mavenLocal
