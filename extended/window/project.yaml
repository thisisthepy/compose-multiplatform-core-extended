# The window modules, one standalone Amper project like extended/design-systems.
# Module names are the directory names and must be unique, so the GraalVM layers are
# graalvm-macos and graalvm-linux. native/linux is added by its own PR (#28).
# Nothing here may depend on the renderer, its wire protocol or its node table.
modules:
  - common
  - native/macos
  - graalvm/graalvm-macos
  - graalvm/graalvm-linux
  - native/linux
