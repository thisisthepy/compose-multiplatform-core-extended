# Hosts a Compose scene in a window opened through WindowPlatform: no ComposeWindow, no
# java.awt, no toolkit. It runs the frame loop, presents each frame through
# FramePresentRecord, and routes pointer, key and input method text to the scene through
# Compose's platform text input.
#
# Apart from common because it needs Compose UI, and common stays stdlib only. The pixels
# a frame is drawn into (Metal on macOS, GL on Linux) belong to the platform layers, which
# hand them over as a WindowSurface.
product:
  type: lib
  platforms: [ jvm, macosArm64 ]

dependencies:
  - ../common
  - $compose.runtime
  # This fork's Compose, not JetBrains': a consumer that links this module also links the
  # fork's foundation and UI, and two copies of the same classes under different groups are
  # not something a resolver can merge. Published to the local Maven repository first by
  # extended/compose/publish-local.sh. The runtime stays JetBrains', which the fork does not
  # publish.
  - org.thisisthepy.compose.foundation:foundation:1.11.1-ext.1
  - org.thisisthepy.compose.ui:ui:1.11.1-ext.1

test-dependencies:
  - $kotlin.test

# The JVM tests make a real scene, which loads skia's native library. It ships in skiko's
# runtime jar for each system, and skiko loads the one for the machine running the tests; the
# module itself never uses it. Named directly rather than through compose.desktop.currentOs,
# which is JetBrains' desktop module and would bring JetBrains' Compose UI next to the fork's.
test-dependencies@jvm:
  - org.jetbrains.skiko:skiko-awt-runtime-macos-arm64:0.144.6
  - org.jetbrains.skiko:skiko-awt-runtime-macos-x64:0.144.6
  - org.jetbrains.skiko:skiko-awt-runtime-linux-x64:0.144.6
  - org.jetbrains.skiko:skiko-awt-runtime-windows-x64:0.144.6

settings:
  compose:
    enabled: true
  publishing:
    enabled: true
    group: org.thisisthepy.compose.window
    artifactId: scene
    version: 0.1.0
  kotlin:
    # The klib takes its Maven coordinates as its unique_name, like the other window modules.
    freeCompilerArgs:
      - -module-name
      - org.thisisthepy.compose.window:scene

test-settings:
  kotlin:
    freeCompilerArgs:
      - -module-name
      - org.thisisthepy.compose.window:scene-test

repositories:
  - id: mavenLocal
    url: mavenLocal
    publish: true
