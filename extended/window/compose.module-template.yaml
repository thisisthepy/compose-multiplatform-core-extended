# Compose's compiler plugin, for the window modules that have a @Composable in them.
#
# Exactly what `settings: compose: enabled` applies (the same plugin, ID and options), without
# the rest of that setting: it also adds JetBrains' org.jetbrains.compose.runtime:runtime and
# org.jetbrains.compose.components:components-resources to every module that enables it, and
# components-resources brings JetBrains' foundation, UI and animation with it. Next to this
# fork's Compose (org.thisisthepy.compose) those are the same classes twice, and the
# Kotlin/Native link of a test executable stops at "IrPropertySymbolImpl is already bound".
# The plugin is released with Kotlin and has to be the Kotlin the toolchain compiles with
# (2.4.10 for the toolchain the `kotlin` wrapper pins).
#
# Applied with `apply: [ <path>/compose.module-template.yaml ]`.
settings:
  jvm:
    jdk:
      version: 21
      selectionMode: javaHome
  kotlin:
    compilerPlugins:
      - id: androidx.compose.compiler.plugins.kotlin
        dependency: org.jetbrains.kotlin:kotlin-compose-compiler-plugin-embeddable:2.4.10
        options:
          generateFunctionKeyMetaAnnotations: "true"
          sourceInformation: "true"
