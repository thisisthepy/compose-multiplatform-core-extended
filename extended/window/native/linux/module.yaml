# The Kotlin/Native window for Linux: Xlib and GLX through cinterop, XIM for text input and
# AT-SPI over D-Bus for accessibility. No C of our own: the headers are the system's.
#
# arm64 is the same module for the other architecture. Kotlin/Native has no arm64 Linux host,
# so it is cross compiled on x86-64.
product:
  type: lib
  platforms: [ linuxX64, linuxArm64 ]

# Compose Multiplatform publishes no Kotlin/Native target for Linux, so the modules below are
# built from this repository and published to the local Maven repository first (see
# .github/workflows/extended-window.yml). skiko has a published linuxX64 target and is
# resolved normally as a dependency of Compose UI.
repositories:
  - id: mavenLocal
    url: mavenLocal
    publish: true

dependencies:
  - ../../common
  - $compose.runtime
  # Root coordinates of the Compose this repository publishes to the local Maven repository
  # under an -ext version (see the workflows that publish it). The version differs from
  # JetBrains' own 1.11.1 on purpose: that one has no Linux variants, and with the same
  # version the resolver takes it and refuses Linux. Gradle module metadata then picks the
  # linuxX64 or linuxArm64 variant per target, and the common metadata compile that
  # publishing runs sees these too.
  - org.jetbrains.compose.animation:animation:1.11.1-ext.1
  - org.jetbrains.compose.animation:animation-core:1.11.1-ext.1
  - org.jetbrains.compose.foundation:foundation:1.11.1-ext.1
  - org.jetbrains.compose.foundation:foundation-layout:1.11.1-ext.1
  - org.jetbrains.compose.material:material-ripple:1.11.1-ext.1
  - org.jetbrains.compose.material3:material3:1.11.0-alpha07-ext.1
  - org.jetbrains.compose.ui:ui:1.11.1-ext.1
  - org.jetbrains.compose.ui:ui-backhandler:1.11.1-ext.1
  - org.jetbrains.compose.ui:ui-geometry:1.11.1-ext.1
  - org.jetbrains.compose.ui:ui-graphics:1.11.1-ext.1
  - org.jetbrains.compose.ui:ui-text:1.11.1-ext.1
  - org.jetbrains.compose.ui:ui-tooling-preview:1.11.1-ext.1
  - org.jetbrains.compose.ui:ui-unit:1.11.1-ext.1
  - org.jetbrains.compose.ui:ui-util:1.11.1-ext.1

test-dependencies:
  - $kotlin.test

settings:
  publishing:
    enabled: true
    group: org.thisisthepy.compose.window
    artifactId: native-linux
    version: 0.1.0
  compose: enabled
  kotlin:
    # A klib's unique_name defaults to the Amper module name, which is the directory name
    # (`common`, `macos`, `linux`). The Kotlin/Native linker refuses two libraries with the
    # same unique_name, so any consumer with a module of that name could not link this one.
    # The Maven coordinates are a globally unique name, so the klib takes them.
    freeCompilerArgs:
      - -module-name
      - org.thisisthepy.compose.window:native-linux
    optIns:
      - kotlinx.cinterop.ExperimentalForeignApi
      - kotlinx.cinterop.BetaInteropApi

# Tests compile into a klib of their own that links against the main one, so it needs a
# unique_name of its own too.
test-settings:
  kotlin:
    freeCompilerArgs:
      - -module-name
      - org.thisisthepy.compose.window:native-linux-test
