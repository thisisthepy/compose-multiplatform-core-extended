# The Kotlin/Native window for Linux: Xlib and GLX through cinterop, XIM for text input and
# AT-SPI over D-Bus for accessibility. No C of our own: the headers are the system's.
#
# arm64 is the same module for the other architecture. Kotlin/Native has no arm64 Linux host,
# so it is cross compiled on x86-64.
product:
  type: lib
  platforms: [ linuxX64, linuxArm64 ]

# Compose Multiplatform publishes no Kotlin/Native target for Linux, so the modules below are
# built from this repository and published to the local Maven repository first (see
# .github/workflows/extended-window.yml). skiko has a published linuxX64 target and is
# resolved normally as a dependency of Compose UI.
repositories:
  - mavenLocal

dependencies:
  - ../../common
  - $compose.runtime

dependencies@linuxX64:
  - org.jetbrains.compose.animation:animation-linuxx64:1.11.1
  - org.jetbrains.compose.animation:animation-core-linuxx64:1.11.1
  - org.jetbrains.compose.foundation:foundation-linuxx64:1.11.1
  - org.jetbrains.compose.foundation:foundation-layout-linuxx64:1.11.1
  - org.jetbrains.compose.material:material-ripple-linuxx64:1.11.1
  - org.jetbrains.compose.material3:material3-linuxx64:1.11.0-alpha07
  - org.jetbrains.compose.ui:ui-linuxx64:1.11.1
  - org.jetbrains.compose.ui:ui-backhandler-linuxx64:1.11.1
  - org.jetbrains.compose.ui:ui-geometry-linuxx64:1.11.1
  - org.jetbrains.compose.ui:ui-graphics-linuxx64:1.11.1
  - org.jetbrains.compose.ui:ui-text-linuxx64:1.11.1
  - org.jetbrains.compose.ui:ui-tooling-preview-linuxx64:1.11.1
  - org.jetbrains.compose.ui:ui-unit-linuxx64:1.11.1
  - org.jetbrains.compose.ui:ui-util-linuxx64:1.11.1

dependencies@linuxArm64:
  - org.jetbrains.compose.animation:animation-linuxarm64:1.11.1
  - org.jetbrains.compose.animation:animation-core-linuxarm64:1.11.1
  - org.jetbrains.compose.foundation:foundation-linuxarm64:1.11.1
  - org.jetbrains.compose.foundation:foundation-layout-linuxarm64:1.11.1
  - org.jetbrains.compose.material:material-ripple-linuxarm64:1.11.1
  - org.jetbrains.compose.material3:material3-linuxarm64:1.11.0-alpha07
  - org.jetbrains.compose.ui:ui-linuxarm64:1.11.1
  - org.jetbrains.compose.ui:ui-backhandler-linuxarm64:1.11.1
  - org.jetbrains.compose.ui:ui-geometry-linuxarm64:1.11.1
  - org.jetbrains.compose.ui:ui-graphics-linuxarm64:1.11.1
  - org.jetbrains.compose.ui:ui-text-linuxarm64:1.11.1
  - org.jetbrains.compose.ui:ui-tooling-preview-linuxarm64:1.11.1
  - org.jetbrains.compose.ui:ui-unit-linuxarm64:1.11.1
  - org.jetbrains.compose.ui:ui-util-linuxarm64:1.11.1

test-dependencies:
  - $kotlin.test

settings:
  compose: enabled
  kotlin:
    optIns:
      - kotlinx.cinterop.ExperimentalForeignApi
      - kotlinx.cinterop.BetaInteropApi
