# Where a scene hosted by `ComposeWindowHost` draws on the Kotlin/Native X11 window: Skia over
# the window's GLX framebuffer, the counterpart of graalvm-linux's `x11WindowSurface`.
#
# A module of its own beside native/linux rather than part of it, so that the window itself
# keeps depending on nothing of Compose's scene: an application that only opens a window and
# draws through `X11Window.draw` does not link the scene, and one that hosts a Compose scene adds
# this module. Kotlin/Native has no compile-only dependency, so the scene is an ordinary one.
#
# Published per architecture by scripts/publish-native-linux.sh, with native/linux, for the
# reason given there. Not in project.yaml, which the JVM and macOS workflows build whole; the
# Linux workflow and that script build it in a project of the Linux modules.
product:
  type: lib
  platforms: [ linuxX64, linuxArm64 ]

repositories:
  - id: mavenLocal
    url: mavenLocal
    publish: true

apply:
  - ../../compose.module-template.yaml

dependencies:
  - ../../common
  - ../linux
  - ../../scene

dependencies@linuxX64:
  - org.thisisthepy.compose.runtime:runtime-linuxx64:1.11.1-ext.2
  - org.thisisthepy.compose.runtime:runtime-saveable-linuxx64:1.11.1-ext.2
  - org.thisisthepy.compose.animation:animation-linuxx64:1.11.1-ext.2
  - org.thisisthepy.compose.animation:animation-core-linuxx64:1.11.1-ext.2
  - org.thisisthepy.compose.foundation:foundation-linuxx64:1.11.1-ext.2
  - org.thisisthepy.compose.foundation:foundation-layout-linuxx64:1.11.1-ext.2
  - org.thisisthepy.compose.material:material-ripple-linuxx64:1.11.1-ext.2
  - org.thisisthepy.compose.material3:material3-linuxx64:1.11.1-ext.2
  - org.thisisthepy.compose.ui:ui-linuxx64:1.11.1-ext.2
  - org.thisisthepy.compose.ui:ui-backhandler-linuxx64:1.11.1-ext.2
  - org.thisisthepy.compose.ui:ui-geometry-linuxx64:1.11.1-ext.2
  - org.thisisthepy.compose.ui:ui-graphics-linuxx64:1.11.1-ext.2
  - org.thisisthepy.compose.ui:ui-text-linuxx64:1.11.1-ext.2
  - org.thisisthepy.compose.ui:ui-tooling-preview-linuxx64:1.11.1-ext.2
  - org.thisisthepy.compose.ui:ui-unit-linuxx64:1.11.1-ext.2
  - org.thisisthepy.compose.ui:ui-util-linuxx64:1.11.1-ext.2

dependencies@linuxArm64:
  - org.thisisthepy.compose.runtime:runtime-linuxarm64:1.11.1-ext.2
  - org.thisisthepy.compose.runtime:runtime-saveable-linuxarm64:1.11.1-ext.2
  - org.thisisthepy.compose.animation:animation-linuxarm64:1.11.1-ext.2
  - org.thisisthepy.compose.animation:animation-core-linuxarm64:1.11.1-ext.2
  - org.thisisthepy.compose.foundation:foundation-linuxarm64:1.11.1-ext.2
  - org.thisisthepy.compose.foundation:foundation-layout-linuxarm64:1.11.1-ext.2
  - org.thisisthepy.compose.material:material-ripple-linuxarm64:1.11.1-ext.2
  - org.thisisthepy.compose.material3:material3-linuxarm64:1.11.1-ext.2
  - org.thisisthepy.compose.ui:ui-linuxarm64:1.11.1-ext.2
  - org.thisisthepy.compose.ui:ui-backhandler-linuxarm64:1.11.1-ext.2
  - org.thisisthepy.compose.ui:ui-geometry-linuxarm64:1.11.1-ext.2
  - org.thisisthepy.compose.ui:ui-graphics-linuxarm64:1.11.1-ext.2
  - org.thisisthepy.compose.ui:ui-text-linuxarm64:1.11.1-ext.2
  - org.thisisthepy.compose.ui:ui-tooling-preview-linuxarm64:1.11.1-ext.2
  - org.thisisthepy.compose.ui:ui-unit-linuxarm64:1.11.1-ext.2
  - org.thisisthepy.compose.ui:ui-util-linuxarm64:1.11.1-ext.2

test-dependencies:
  - $kotlin.test

settings:
  publishing:
    enabled: true
    group: org.thisisthepy.compose.window
    artifactId: native-linux-scene
    version: 1.11.1-ext.2
  kotlin:
    # The klib takes its Maven coordinates as its unique_name, like the other window modules.
    freeCompilerArgs:
      - -module-name
      - org.thisisthepy.compose.window:native-linux-scene
      - -Xklib-duplicated-unique-name-strategy=allow-first-with-warning
    optIns:
      - kotlinx.cinterop.ExperimentalForeignApi

test-settings:
  kotlin:
    freeCompilerArgs:
      - -module-name
      - org.thisisthepy.compose.window:native-linux-scene-test
      - -Xklib-duplicated-unique-name-strategy=allow-first-with-warning
