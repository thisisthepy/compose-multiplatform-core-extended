# The Kotlin/Native macOS window: AppKit for the window and its input, Metal for the surface.
#
# An operating system layer only. It has no JVM, no AWT and no hand-written interop: every
# call goes through the platform libraries Kotlin/Native already ships. Policy, such as the
# smallest size a window is given or what text on the clipboard means, is decided in the
# common window module and reached from here.
product:
  type: lib
  platforms: [ macosArm64 ]

# Compose's compiler plugin through the template rather than `compose: enabled`, which would add
# JetBrains' runtime and components-resources and with them JetBrains' Compose next to the fork's.
apply:
  - ../../compose.module-template.yaml

dependencies:
  - ../../common
  # This fork's Compose, not JetBrains': a consumer that links this module also links the
  # fork's foundation and UI, and two copies of the same classes under different groups are
  # not something a resolver can merge. Published to the local Maven repository first by
  # extended/compose/publish-local.sh. The runtime is the fork's too, a stub with no classes
  # that points at androidx.compose.runtime.
  #
  # Named by each module's macosArm64 coordinate, every module the window reaches, as
  # native/linux names its Linux ones: through the roots, the test executable's link met
  # animation-core twice ("IrPropertySymbolImpl is already bound").
  - org.thisisthepy.compose.runtime:runtime-macosarm64:1.11.1-ext.1
  - org.thisisthepy.compose.runtime:runtime-saveable-macosarm64:1.11.1-ext.1
  - org.thisisthepy.compose.animation:animation-macosarm64:1.11.1-ext.1
  - org.thisisthepy.compose.animation:animation-core-macosarm64:1.11.1-ext.1
  - org.thisisthepy.compose.foundation:foundation-macosarm64:1.11.1-ext.1
  - org.thisisthepy.compose.foundation:foundation-layout-macosarm64:1.11.1-ext.1
  - org.thisisthepy.compose.material:material-ripple-macosarm64:1.11.1-ext.1
  - org.thisisthepy.compose.ui:ui-macosarm64:1.11.1-ext.1
  - org.thisisthepy.compose.ui:ui-backhandler-macosarm64:1.11.1-ext.1
  - org.thisisthepy.compose.ui:ui-geometry-macosarm64:1.11.1-ext.1
  - org.thisisthepy.compose.ui:ui-graphics-macosarm64:1.11.1-ext.1
  - org.thisisthepy.compose.ui:ui-text-macosarm64:1.11.1-ext.1
  - org.thisisthepy.compose.ui:ui-tooling-preview-macosarm64:1.11.1-ext.1
  - org.thisisthepy.compose.ui:ui-unit-macosarm64:1.11.1-ext.1
  - org.thisisthepy.compose.ui:ui-util-macosarm64:1.11.1-ext.1

test-dependencies:
  - $kotlin.test

settings:
  publishing:
    enabled: true
    group: org.thisisthepy.compose.window
    artifactId: native-macos
    version: 0.1.0
  kotlin:
    # A klib's unique_name defaults to the Amper module name, which is the directory name
    # (`common`, `macos`, `linux`). The Kotlin/Native linker refuses two libraries with the
    # same unique_name, so any consumer with a module of that name could not link this one.
    # The Maven coordinates are a globally unique name, so the klib takes them.
    freeCompilerArgs:
      - -module-name
      - org.thisisthepy.compose.window:native-macos
    optIns:
      - kotlinx.cinterop.ExperimentalForeignApi
      - kotlinx.cinterop.BetaInteropApi

# Tests compile into a klib of their own that links against the main one, so it needs a
# unique_name of its own too.
test-settings:
  kotlin:
    freeCompilerArgs:
      - -module-name
      - org.thisisthepy.compose.window:native-macos-test

repositories:
  - id: mavenLocal
    url: mavenLocal
    publish: true
