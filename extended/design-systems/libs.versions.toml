[versions]
logback = "1.6.2"
androidx-activity-compose = "1.13.0"
androidx-lifecycle = "2.11.0"
kotlinx-coroutines = "1.11.0"
# This fork's Compose, at the fork's one version line (jetbrains.publication.version.COMPOSE in
# the root gradle.properties). Equal to `version` in publish.module-template.yaml; a release
# raises both. On Android the fork's roots point at androidx.compose, so the same coordinates
# serve every target.
compose-fork = "1.11.1-ext.4"
# The skia binaries the JVM tests load, the version the fork's Compose is built against.
skiko = "0.144.6"

[libraries]
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }
compose-fork-runtime = { module = "org.thisisthepy.compose.runtime:runtime", version.ref = "compose-fork" }
compose-fork-foundation = { module = "org.thisisthepy.compose.foundation:foundation", version.ref = "compose-fork" }
compose-fork-ui = { module = "org.thisisthepy.compose.ui:ui", version.ref = "compose-fork" }
compose-fork-material3 = { module = "org.thisisthepy.compose.material3:material3", version.ref = "compose-fork" }
skiko-runtime-macos-arm64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-macos-arm64", version.ref = "skiko" }
skiko-runtime-macos-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-macos-x64", version.ref = "skiko" }
skiko-runtime-linux-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-linux-x64", version.ref = "skiko" }
skiko-runtime-windows-x64 = { module = "org.jetbrains.skiko:skiko-awt-runtime-windows-x64", version.ref = "skiko" }
