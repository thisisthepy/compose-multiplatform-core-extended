# The vocabulary every design system speaks: roles in, styles out.
#
# This module defines the contract and nothing else. It has no opinion about how a
# Primary colour looks; that is what the three implementations are for. It must stay free
# of any dependency on renderer, which is what lets this project ship on
# its own.

product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, macosArm64, linuxX64, wasmJs ]

dependencies:
  - $libs.compose.fork.runtime
  - $libs.compose.fork.foundation
  - $libs.compose.fork.ui

apply:
  - ../publish.module-template.yaml

settings:
  publishing:
    artifactId: designsystem
    pom:
      name: "Design systems: core"
      description: "The contract every design system speaks: colour roles, styles and the DesignSystem interface."

# A klib's unique_name defaults to the Amper module name, the directory name, which a
# consumer's own module (or another library) can share; the Kotlin/Native linker refuses two
# libraries with one unique_name. The Maven coordinates are globally unique. Native only:
# the Wasm compiler takes no -module-name.
settings@native:
  kotlin:
    freeCompilerArgs:
      - -module-name
      - org.thisisthepy.compose.designsystem:designsystem

test-settings@native:
  kotlin:
    freeCompilerArgs:
      - -module-name
      - org.thisisthepy.compose.designsystem:designsystem-test
