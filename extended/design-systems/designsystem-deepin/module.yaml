# Deepin (DDE).
#
# The Linux fallback: what `adaptive` picks when the session is neither GNOME nor KDE, or
# cannot be identified at all (SPEC FR-14.3). It therefore has to look reasonable on an
# unknown desktop, not just on Deepin.

product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, macosArm64, linuxX64, wasmJs ]

dependencies:
  - //designsystem: exported
  - $libs.compose.fork.runtime
  - $libs.compose.fork.foundation
  - $libs.compose.fork.ui

test-dependencies:
  # The test that the three Linux systems have not collapsed onto the same values
  # needs all three on its classpath. It lives here because this one is the fallback,
  # the system most likely to drift towards a neutral grey theme.
  - //designsystem-gnome
  - //designsystem-breeze
  - $kotlin.test

apply:
  - ../publish.module-template.yaml

settings:
  publishing:
    artifactId: designsystem-deepin
    pom:
      name: "Design systems: Deepin"
      description: "Deepin (DDE) as a design system for Compose."

# A klib's unique_name defaults to the Amper module name, the directory name, which a
# consumer's own module (or another library) can share; the Kotlin/Native linker refuses two
# libraries with one unique_name. The Maven coordinates are globally unique. Native only:
# the Wasm compiler takes no -module-name.
settings@native:
  kotlin:
    freeCompilerArgs:
      - -module-name
      - org.thisisthepy.compose.designsystem:designsystem-deepin

test-settings@native:
  kotlin:
    freeCompilerArgs:
      - -module-name
      - org.thisisthepy.compose.designsystem:designsystem-deepin-test
