# Material 3, by delegation.
#
# androidx.compose.material3 is the reference implementation and is already a first party
# dependency, so this module maps roles onto MaterialTheme and calls the real composables.
# It does not redraw them from foundation: hand written Material is always a worse
# Material, and ripple, state layers, motion and accessibility semantics come free here.

product:
  type: kmp/lib
  platforms: [ jvm, android, iosArm64, iosSimulatorArm64, macosArm64, linuxX64, wasmJs ]

dependencies:
  - //designsystem: exported
  - $libs.compose.fork.material3: exported
  - $libs.compose.fork.runtime
  - $libs.compose.fork.foundation
  - $libs.compose.fork.ui

test-dependencies:
  - $kotlin.test
  # Test only, and never a production dependency in either direction. The claim that
  # these are two design systems and not one with two palettes can only be checked by
  # asking both the same question in the same test.
  - //designsystem-fluent

apply:
  - ../publish.module-template.yaml

settings:
  publishing:
    artifactId: designsystem-material3
    pom:
      name: "Design systems: Material 3"
      description: "Material 3 as a design system, delegating to androidx.compose.material3."

# A klib's unique_name defaults to the Amper module name, the directory name, which a
# consumer's own module (or another library) can share; the Kotlin/Native linker refuses two
# libraries with one unique_name. The Maven coordinates are globally unique. Native only:
# the Wasm compiler takes no -module-name.
settings@native:
  kotlin:
    freeCompilerArgs:
      - -module-name
      - org.thisisthepy.compose.designsystem:designsystem-material3

test-settings@native:
  kotlin:
    freeCompilerArgs:
      - -module-name
      - org.thisisthepy.compose.designsystem:designsystem-material3-test
