# What every design system module shares: Compose's compiler plugin, and how it is published.
#
# Applied with `apply: [ ../publish.module-template.yaml ]`.
#
# Compose's compiler plugin is applied directly rather than through `settings: compose:
# enabled`, which also adds JetBrains' org.jetbrains.compose.runtime:runtime and
# components-resources (and with it JetBrains' foundation, UI and animation) to the module.
# These modules are built against this fork's Compose (libs.versions.toml, `compose-fork`), and
# a published module that named both would hand every consumer two copies of the same classes
# under two groups, which no resolver can merge. Same plugin, ID and options as `compose:
# enabled`; the plugin is released with Kotlin and has to be the Kotlin the toolchain compiles
# with (2.4.10 for the toolchain the `kotlin` wrapper pins). extended/window does the same.
#
# The version is this fork's one version line, jetbrains.publication.version.COMPOSE in the
# root gradle.properties, and has to equal `compose-fork` in libs.versions.toml: a release
# raises all three in one commit. scripts/check-version.sh fails the publish when they differ.
# POM fields are the ones extended/publish/central_bundle.py writes for the window modules.
settings:
  kotlin:
    compilerPlugins:
      - id: androidx.compose.compiler.plugins.kotlin
        dependency: org.jetbrains.kotlin:kotlin-compose-compiler-plugin-embeddable:2.4.10
        options:
          generateFunctionKeyMetaAnnotations: "true"
          sourceInformation: "true"
  publishing:
    enabled: true
    group: org.thisisthepy.compose.designsystem
    version: 1.11.1-ext.4
    # Central asks for a sources jar beside every artifact; without it the bundle tool would
    # add an empty one.
    publishSources: true
    pom:
      url: https://github.com/thisisthepy/compose-multiplatform-core-extended
      licenses:
        - name: The Apache License, Version 2.0
          url: https://www.apache.org/licenses/LICENSE-2.0.txt
      developers:
        - id: thisisthepy
          name: thisisthepy
          url: https://github.com/thisisthepy
      scm:
        url: https://github.com/thisisthepy/compose-multiplatform-core-extended
        connection: scm:git:https://github.com/thisisthepy/compose-multiplatform-core-extended.git
        developerConnection: scm:git:ssh://git@github.com/thisisthepy/compose-multiplatform-core-extended.git

# The fork's Compose is resolved from Maven Central once a release has it, and before that
# from the local Maven repository that extended/compose/publish-local.sh (or the publish
# workflow) fills; the design systems are published there too.
repositories:
  - id: mavenLocal
    url: mavenLocal
    publish: true
