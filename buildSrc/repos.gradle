def supportRootFolder = ext.supportRootFolder
if (supportRootFolder == null) {
    throw new RuntimeException("Canonical root project directory is not set. You must specify " +
            "ext.supportRootFolder before including this script")
}
// Makes strong assumptions about the project structure.
def checkoutRoot = supportRootFolder.parentFile.parentFile

ext.repos = new Properties()
ext.repos.checkoutRoot = checkoutRoot.absolutePath
ext.repos.prebuiltsRoot = new File(checkoutRoot, "prebuilts").absolutePath

/**
 * Adds maven repositories to the given repository handler.
 */
def addMavenRepositories(RepositoryHandler handler) {
    def metalavaRepoOverride = System.getenv("METALAVA_REPO")
    if (metalavaRepoOverride != null) {
        for(extraRepo in metalavaRepoOverride.split(File.pathSeparator)) {
            handler.maven {
                url = extraRepo
            }
        }
    }
    /*
    handler.maven {
        url = "${repos.prebuiltsRoot}/androidx/internal"
        metadataSources {
            mavenPom()
            artifact()
        }
        content {
            includeGroupByRegex "android.*"
            includeGroupByRegex "com.android.support.*"
            excludeGroupByRegex "androidx.databinding.*"
        }
    }
    handler.maven {
        url = "${repos.prebuiltsRoot}/androidx/external"
        metadataSources {
            mavenPom()
            artifact()
        }
        if (metalavaRepoOverride != null) {
            // When using custom metalava repo, do not resolve metalava artifacts from this repo
            content {
                excludeGroup "com.android.tools.metalava"
            }
        }
    }
    */
    if (true /* In JetBrains Fork */) {
        // skiko from the local repository first, and nothing else from it. skiko publishes
        // no mingwX64 target; the one built for this is published locally under the same
        // version, with the root metadata extended to name it. Found later, after Maven
        // Central, the root that does not name it would win and mingwX64 would not resolve.
        handler.mavenLocal {
            content {
                includeGroup("org.jetbrains.skiko")
            }
        }
        // A mirror of Maven Central to ask first, for a CI that Central answers with 429 Too
        // Many Requests when runners share an address. COMPOSE_MAVEN_MIRROR is one URL, or
        // several separated by spaces or commas (a URL has a colon, so not File.pathSeparator).
        // It is read here, so the build's own buildscript blocks (buildSrc/shared.gradle) take
        // it as well, which no init script reaches; METALAVA_REPO above is split on the path
        // separator and so cannot take a URL. What the mirror does not have falls through to
        // the repositories below.
        def mavenMirror = System.getenv("COMPOSE_MAVEN_MIRROR")
        if (mavenMirror != null) {
            for (mirrorUrl in mavenMirror.split("[\\s,]+")) {
                if (mirrorUrl.isEmpty()) continue
                handler.maven {
                    url = mirrorUrl
                    content(repos.notOnMavenCentral)
                }
            }
        }
        handler.mavenCentral {
            content(repos.notOnMavenCentral)
        }
        handler.google {
            content {
                includeGroupByRegex("androidx.*")
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
            }
        }
        handler.gradlePluginPortal()
        handler.maven {
            url = "https://packages.jetbrains.team/maven/p/cmp/dev"
        }
        handler.maven {
            url = "https://packages.jetbrains.team/maven/p/kt/dev"
            content {
                includeGroupByRegex("org\\.jetbrains\\.kotlin.*")
            }
        }
        handler.maven {
            url = "https://central.sonatype.com/repository/maven-snapshots"
        }
        handler.mavenLocal()
    }
    // Ordering appears to be important: b/229733266
    def androidPluginRepoOverride = System.getenv("GRADLE_PLUGIN_REPO")
    if (androidPluginRepoOverride != null) {
        for(extraRepo in androidPluginRepoOverride.split(File.pathSeparator)) {
            handler.maven {
                url = extraRepo
            }
        }
    }
}

// What Maven Central does not have, kept from being asked there and from its mirror: AndroidX
// and the Android tools are on Google's Maven only, and the Develocity plugins on the Gradle
// plugin portal only. A 429 Too Many Requests from Central ends a resolution there, so the
// repository that has the module is never asked (fork-train-18: androidx.annotation:annotation-js,
// com.gradle:develocity-gradle-plugin, androidx.build.gradle.gcpbuildcache:gcpbuildcache).
// settings.gradle's pluginManagement keeps the same list.
ext.repos.notOnMavenCentral = { content ->
    content.excludeGroupByRegex("androidx(\\..*)?")
    content.excludeGroupByRegex("com\\.android(\\..*)?")
    content.excludeModule("com.gradle", "develocity-gradle-plugin")
    content.excludeModule("com.gradle", "common-custom-user-data-gradle-plugin")
}

ext.repos.addMavenRepositories = this.&addMavenRepositories
