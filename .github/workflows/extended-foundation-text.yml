# Compiles compose:foundation:foundation for the desktop and runs its text tests whenever
# foundation's text code changes. Text layout in commonMain is what every platform draws
# with, and the upstream test workflow does not run on pull requests to `extended`, so a
# change there would otherwise reach `extended` with nothing having run it.
name: extended foundation text

on:
  workflow_dispatch:
  pull_request:
    branches: [ extended ]
    paths:
      - compose/foundation/foundation/src/commonMain/**/text/**
      - compose/foundation/foundation/src/skikoMain/**/text/**
      - compose/foundation/foundation/src/skikoTest/**/text/**
      - .github/workflows/extended-foundation-text.yml
  push:
    branches: [ extended ]
    paths:
      - compose/foundation/foundation/src/commonMain/**/text/**
      - compose/foundation/foundation/src/skikoMain/**/text/**
      - compose/foundation/foundation/src/skikoTest/**/text/**
      - .github/workflows/extended-foundation-text.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: foundation desktop (text tests)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Start an X server
        # Some of the text tests open a Compose test window.
        run: |
          sudo Xvfb :1 -screen 0 1920x1080x24 -extension RANDR +extension GLX &
          echo "DISPLAY=:1.0" >> "$GITHUB_ENV"
      - name: Compile and run foundation's text tests on the desktop
        run: |
          ./gradlew :compose:foundation:foundation:desktopTest \
            --tests 'androidx.compose.foundation.text.*' \
            -Pcompose.platforms=desktop --no-daemon --stacktrace
      - name: The layout cache test ran
        run: |
          ls compose/foundation/foundation/build/test-results/desktopTest/ | grep -q LayoutCacheWidthChangeTest ||
            { echo "LayoutCacheWidthChangeTest did not run" >&2; exit 1; }
      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: foundation-text-test-reports
          path: compose/foundation/foundation/build/reports/tests/
          retention-days: 7
