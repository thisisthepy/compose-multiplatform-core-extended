# Everything this fork ships, published to the local Maven repository with
# extended/publish-local-all.sh and kept as one repository. A Mac publishes everything that has
# a root (Compose for the desktop JVM, macosArm64, linuxX64, linuxArm64 and mingwX64, skiko-awt,
# the window modules but two, the plugin), so every Kotlin Multiplatform root and its shared
# metadata come from one build that had every target. Linux adds native/linux, which reads the
# system's X11 headers, and Windows adds windows-shared, whose C half is MSVC's; neither touches
# a root the Mac wrote. Then a Gradle consumer resolves all of it for every target and fails if
# JetBrains' Compose comes with it. Heavy, so it runs on demand and when these files change.
name: Extended publish local

on:
  workflow_dispatch:
  pull_request:
    paths:
      - extended/publish-local-all.sh
      - extended/compose/**
      - .github/workflows/extended-publish-local.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  XWIN_VERSION: 0.6.5

jobs:
  mac:
    name: Publish everything with a root (macOS)
    runs-on: macos-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: The MSVC runtime and Windows SDK headers, for skiko's mingwX64 half
        run: |
          set -euo pipefail
          case "$(uname -m)" in arm64) triple=aarch64-apple-darwin ;; *) triple=x86_64-apple-darwin ;; esac
          curl -fsSL "https://github.com/Jake-Shadle/xwin/releases/download/$XWIN_VERSION/xwin-$XWIN_VERSION-$triple.tar.gz" |
            tar xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/xwin-$XWIN_VERSION-$triple/xwin" --accept-license \
            splat --output "$HOME/Library/Caches/cargo-xwin/xwin"

      - name: Publish
        env:
          ANDROIDX_JDK21: ${{ env.JAVA_HOME }}
        run: |
          set -euo pipefail
          ./extended/publish-local-all.sh "$RUNNER_TEMP/publish"
          find ~/.m2/repository/org/thisisthepy -name '*.module' | sed 's#.*/repository/##' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: org-thisisthepy-mac
          path: ~/.m2/repository/org/thisisthepy
          retention-days: 14

  linux:
    name: Add native/linux (Linux)
    needs: mac
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            extended
            gradle.properties

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Linux packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxext-dev libgl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev

      - uses: actions/download-artifact@v4
        with:
          name: org-thisisthepy-mac
          path: ~/.m2/repository/org/thisisthepy

      - name: Publish
        run: |
          set -euo pipefail
          ./extended/publish-local-all.sh "$RUNNER_TEMP/publish"
          find ~/.m2/repository/org/thisisthepy/compose/window -path '*native-linux*' -name '*.module' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: org-thisisthepy-linux
          path: ~/.m2/repository/org/thisisthepy/compose/window/native-linux*
          retention-days: 14

  windows:
    name: Add windows-shared (Windows)
    runs-on: windows-2022
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            extended
            gradle.properties

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Publish
        run: |
          set -euo pipefail
          ./extended/publish-local-all.sh "$RUNNER_TEMP/publish"
          find ~/.m2/repository/org/thisisthepy/compose/window -path '*windows-shared*' -name '*.module' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: org-thisisthepy-windows
          path: ~/.m2/repository/org/thisisthepy/compose/window/windows-shared*
          retention-days: 14

  consumer:
    name: A consumer resolves no JetBrains Compose (macOS)
    needs: [mac, linux, windows]
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            extended/compose
            gradle.properties

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.0'

      - uses: actions/download-artifact@v4
        with:
          name: org-thisisthepy-mac
          path: ~/.m2/repository/org/thisisthepy
      - uses: actions/download-artifact@v4
        with:
          name: org-thisisthepy-linux
          path: ~/.m2/repository/org/thisisthepy/compose/window
      - uses: actions/download-artifact@v4
        with:
          name: org-thisisthepy-windows
          path: ~/.m2/repository/org/thisisthepy/compose/window

      - name: Every target resolves, with no JetBrains Compose that carries classes
        run: |
          set -euo pipefail
          version="$(sed -n 's/^jetbrains.publication.version.COMPOSE=//p' gradle.properties)"
          gradle -p extended/compose/consumer-check checkResolution --no-daemon "-PforkVersion=$version"

      - name: The repository, as one artifact
        uses: actions/upload-artifact@v4
        with:
          name: org-thisisthepy
          path: ~/.m2/repository/org/thisisthepy
          retention-days: 14
