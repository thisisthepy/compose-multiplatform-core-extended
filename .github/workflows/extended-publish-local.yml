# Everything this fork ships, published to the local Maven repository the way
# extended/publish-local-all.sh does it on each host, and kept as an artifact per host: the
# macOS one (desktop, macosArm64, the scene and native/macos), the Linux one (desktop, both
# Linux architectures, mingwX64 and native/linux) and the Windows one (windows-shared). One
# version line, gradle.properties'. Heavy, so it runs on demand and when the script changes.
name: Extended publish local

on:
  workflow_dispatch:
  pull_request:
    paths:
      - extended/publish-local-all.sh
      - .github/workflows/extended-publish-local.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  publish:
    name: Publish everything (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Linux and mingwX64, os: ubuntu-24.04 }
          - { name: Windows, os: windows-2022 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /usr/local/julia* /opt/microsoft /opt/google
          df -h /

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'

      - uses: gradle/actions/setup-gradle@v4
        if: runner.os != 'Windows'
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Linux packages, and the MSVC runtime and SDK headers for mingwX64
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxext-dev libgl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev curl unzip
          # skiko's C++ half for mingwX64 is compiled in MSVC mode against these.
          version=0.6.5
          curl -fsSL "https://github.com/Jake-Shadle/xwin/releases/download/$version/xwin-$version-x86_64-unknown-linux-musl.tar.gz" |
            tar xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/xwin-$version-x86_64-unknown-linux-musl/xwin" --accept-license \
            splat --output "$HOME/.cache/cargo-xwin/xwin"
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<PROPERTIES
          org.gradle.caching=false
          org.gradle.workers.max=4
          org.gradle.jvmargs=-Xmx11g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dlint.nullness.ignore-deprecated=true -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          PROPERTIES

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64

      - name: Publish
        env:
          ANDROIDX_JDK21: ${{ env.JAVA_HOME }}
        run: |
          set -euo pipefail
          ./extended/publish-local-all.sh "$RUNNER_TEMP/publish"
          find ~/.m2/repository/org/thisisthepy -name '*.pom' | sort

      - uses: actions/upload-artifact@v4
        with:
          name: org-thisisthepy-${{ runner.os }}
          path: ~/.m2/repository/org/thisisthepy
          retention-days: 14
