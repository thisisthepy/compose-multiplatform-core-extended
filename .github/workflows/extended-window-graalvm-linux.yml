# The GraalVM X11 window layer under extended/window/graalvm/graalvm-linux: compile the C and the
# Kotlin on Linux. A standalone Amper project, so only that directory is checked out.
name: extended window graalvm linux

on:
  workflow_dispatch:
  pull_request:
    paths:
      - extended/window/**
      - .github/workflows/extended-window-graalvm-linux.yml
  push:
    branches: [ extended ]
    paths:
      - extended/window/**
      - .github/workflows/extended-window-graalvm-linux.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: extended/window

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: X11 and GL headers
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxext-dev libgl-dev libgl1-mesa-dri libglx-mesa0 xvfb

      - name: Compile the C
        working-directory: extended/window/graalvm/graalvm-linux
        run: |
          mkdir -p build
          cc -c -O2 -fPIC -Wall -o build/x11_window.o c/x11_window.c

      - name: Drag files onto the window (XDND client under a virtual display)
        working-directory: extended/window/graalvm/graalvm-linux
        run: |
          cc -O1 -Wall -o build/xdnd_drop_test test/c/xdnd_drop_test.c -lX11 -lXext -lGL
          xvfb-run -a -s "-screen 0 1280x800x24" ./build/xdnd_drop_test

      - name: Wake the window's wait from another thread (under a virtual display)
        working-directory: extended/window/graalvm/graalvm-linux
        run: |
          cc -O1 -Wall -pthread -o build/wake_test test/c/wake_test.c -lX11 -lXext -lGL
          xvfb-run -a -s "-screen 0 1280x800x24" ./build/wake_test

      - name: Wake latency, 200 posts from another thread (under a virtual display)
        working-directory: extended/window/graalvm/graalvm-linux
        run: |
          cc -O1 -Wall -pthread -o build/wake_latency_test test/c/wake_latency_test.c -lX11 -lXext -lGL
          xvfb-run -a -s "-screen 0 1280x800x24" ./build/wake_latency_test | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Scripted drag and the resize count (under a virtual display)
        working-directory: extended/window/graalvm/graalvm-linux
        run: |
          cc -O1 -Wall -o build/resize_test test/c/resize_test.c -lX11 -lXext -lGL
          xvfb-run -a -s "-screen 0 1280x800x24" ./build/resize_test

      - name: The semantics reader is the Kotlin/Native window's, unchanged
        working-directory: extended/window
        run: |
          cmp native/linux/src/AtspiSemantics.kt \
            graalvm/graalvm-linux/src/org/thisisthepy/compose/window/atspi/AtspiSemantics.kt || {
            echo "graalvm-linux's AtspiSemantics.kt differs from native/linux's; change both together" >&2
            exit 1
          }

      - name: The Kotlin module has no java.awt
        working-directory: extended/window/graalvm/graalvm-linux
        run: |
          if grep -rn "java\.awt\|javax\.swing" src test; then
            echo "java.awt is not allowed in this module" >&2
            exit 1
          fi

      - name: Compile and test the Kotlin
        working-directory: extended/window
        run: |
          ./kotlin build -m graalvm-linux -p jvm
          ./kotlin test -m graalvm-linux -p jvm
