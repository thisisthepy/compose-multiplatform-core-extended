# Desktop tests for the fork-only changes, with no Android SDK. Each change adds its own
# test filter to the matrix below.

name: Extended desktop tests

on:
  workflow_call: {}

permissions:
  contents: read

env:
  # Google's mirror of Maven Central, asked before Central by buildSrc/repos.gradle: Central
  # answers runners that share an address with 429 Too Many Requests (fork-train-16).
  COMPOSE_MAVEN_MIRROR: https://maven-central.storage-download.googleapis.com/maven2 https://plugins.gradle.org/m2
  # Retry transient dependency download failures (TLS handshake resets, timeouts) with
  # backoff. These are JVM system properties read by Gradle's repository transport, so
  # they must reach the daemon and Amper's JVMs; JAVA_TOOL_OPTIONS is inherited by all.
  JAVA_TOOL_OPTIONS: >-
    -Dorg.gradle.internal.repository.max.retries=6
    -Dorg.gradle.internal.repository.initial.backoff=1000
    -Dorg.gradle.internal.http.connectionTimeout=120000
    -Dorg.gradle.internal.http.socketTimeout=120000

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AWT-free ClipEntry
            task: :compose:foundation:foundation:desktopTest
            filter: '*AwtFreeClipEntryTest*'
          - name: AWT-free text direction
            task: :compose:ui:ui-text:desktopTest
            filter: '*AwtFreeTextDirectionTest*'
          - name: Embedder main dispatcher
            task: :compose:ui:ui:desktopTest
            filter: '*AwtFreeMainDispatcherTest*'
          - name: CSS half-leading
            task: :compose:ui:ui-text:desktopTest
            filter: 'androidx.compose.ui.text.SkikoParagraphTest.cssHalfLeading_keptWhenLineHeightLessOrEqualFontSize'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Run test
        run: |
          for attempt in 1 2 3; do
            if ./gradlew ${{ matrix.task }} --tests '${{ matrix.filter }}' --no-daemon --stacktrace; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "gradlew failed on attempt $attempt; retrying in $((attempt * 15))s..." >&2
            sleep $((attempt * 15))
          done
