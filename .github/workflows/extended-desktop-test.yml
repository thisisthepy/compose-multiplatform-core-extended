# Desktop tests for the fork-only changes, with no Android SDK. Each change adds its own
# test filter to the matrix below.

name: Extended desktop tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - extended
    paths:
      - compose/foundation/foundation/src/desktop*/**
      - compose/ui/ui/src/desktop*/**
      - extended/**
      - .github/workflows/extended-desktop-test.yml
  push:
    branches:
      - extended
    paths:
      - compose/foundation/foundation/src/desktop*/**
      - compose/ui/ui/src/desktop*/**
      - extended/**
      - .github/workflows/extended-desktop-test.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Retry transient dependency download failures (TLS handshake resets, timeouts) with
  # backoff. These are JVM system properties read by Gradle's repository transport, so
  # they must reach the daemon and Amper's JVMs; JAVA_TOOL_OPTIONS is inherited by all.
  JAVA_TOOL_OPTIONS: >-
    -Dorg.gradle.internal.repository.max.retries=6
    -Dorg.gradle.internal.repository.initial.backoff=1000
    -Dorg.gradle.internal.http.connectionTimeout=120000
    -Dorg.gradle.internal.http.socketTimeout=120000

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AWT-free ClipEntry
            task: :compose:foundation:foundation:desktopTest
            filter: '*AwtFreeClipEntryTest*'
          - name: AWT-free text direction
            task: :compose:ui:ui-text:desktopTest
            filter: '*AwtFreeTextDirectionTest*'
          - name: Embedder main dispatcher
            task: :compose:ui:ui:desktopTest
            filter: '*AwtFreeMainDispatcherTest*'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Run test
        run: ./gradlew ${{ matrix.task }} --tests '${{ matrix.filter }}' --no-daemon --stacktrace
