# Desktop tests for the fork-only changes, with no Android SDK. Each change adds its own
# test filter to the matrix below.

name: Extended desktop tests

on:
  workflow_dispatch:
  pull_request:
    branches:
      - extended
    paths:
      - compose/foundation/foundation/src/desktop*/**
      - compose/ui/ui/src/desktop*/**
      - extended/**
      - .github/workflows/extended-desktop-test.yml

concurrency:
  group: extended-desktop-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AWT-free ClipEntry
            task: :compose:foundation:foundation:desktopTest
            filter: '*AwtFreeClipEntryTest*'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run test
        run: ./gradlew ${{ matrix.task }} --tests '${{ matrix.filter }}' --no-daemon --stacktrace
