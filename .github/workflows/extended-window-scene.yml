# extended/window/scene: the Compose scene host over WindowPlatform.
#
# Builds and tests it for the JVM (what the GraalVM path runs) and macosArm64, and fails if
# the module names java.awt or a toolkit window class. The JVM tests run on Linux as well,
# because the GraalVM X11 window is hosted by the same code and its frame clock is checked
# on the machine it runs on. The graalvm-linux change that gives
# the host a GL frame is compiled by the same job.

name: Extended window scene

on:
  workflow_dispatch:
  pull_request:
    paths:
      - extended/window/**
      - .github/workflows/extended-window-scene.yml
      - .github/actions/fork-compose/**
      - extended/compose/**
  push:
    branches:
      - extended
    paths:
      - extended/window/**
      - .github/workflows/extended-window-scene.yml
      - .github/actions/fork-compose/**
      - extended/compose/**

concurrency:
  group: extended-window-scene-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: scene (jvm, macosArm64)
    runs-on: macos-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: extended/window
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            extended/window
            .github/actions
          filter: blob:none

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: The module names no java.awt and no toolkit window
        run: |
          if grep -rEn '^import (java\.awt|javax\.swing|sun\.awt|androidx\.compose\.ui\.awt|androidx\.compose\.ui\.window)' scene/src; then
            echo "scene must not import java.awt or a toolkit window" >&2
            exit 1
          fi

      - name: Cache the Kotlin toolchain, konan and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
            ~/.m2/repository
          key: extended-window-scene-${{ runner.os }}-${{ hashFiles('extended/window/**/module.yaml', 'extended/window/libs.versions.toml', 'extended/window/kotlin') }}
          restore-keys: |
            extended-window-scene-${{ runner.os }}-

      # The scene compiles against this fork's foundation and UI, which nothing publishes.
      - name: This fork's Compose for the JVM and macosArm64
        uses: ./.github/actions/fork-compose
        with:
          targets: desktop macosArm64

      # The scene declares the Linux targets too, which this runner builds no Compose for.
      - name: The scene for this runner's platforms
        run: |
          sed -i '' 's/^  platforms: \[.*\]$/  platforms: [ jvm, macosArm64 ]/' scene/module.yaml
          grep -qx '  platforms: \[ jvm, macosArm64 \]' scene/module.yaml

      - name: Build
        run: |
          ./kotlin build -p jvm -m scene
          ./kotlin build -p macosArm64 -m scene

      - name: Test (jvm)
        run: ./kotlin test -p jvm -m scene

      - name: Test (macosArm64)
        run: ./kotlin test -p macosArm64 -m scene

      - name: What the test link was given (on failure)
        if: failure()
        run: |
          ./kotlin show dependencies --module scene --platform macosArm64 || ./kotlin show dependencies --module scene || true
          find ~/Library/Caches/JetBrains/Kotlin/.m2.cache/org/jetbrains/compose -name '*.klib' | sort
          find ~/.m2/repository -path '*animation-core*' \( -name '*.klib' -o -name '*.module' \) | sort
          find build -type f \( -name '*.args' -o -name '*argfile*' -o -name '*.rsp' \) 2>/dev/null | head -20 |
            while read -r f; do echo "== $f"; grep -n 'animation' "$f" | head -20; done
          find ~/.cache/JetBrains ~/Library/Caches/JetBrains -name '*.klib' -path '*animation*' 2>/dev/null | head -20

      - name: The Linux GraalVM layer compiles with the GL frame entry
        run: ./kotlin build -p jvm -m graalvm-linux

  linux:
    name: scene (jvm, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    defaults:
      run:
        working-directory: extended/window
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            extended/window
            .github/actions
          filter: blob:none

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache the Kotlin toolchain and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/JetBrains/Kotlin
            ~/.m2/repository
          key: extended-window-scene-${{ runner.os }}-${{ hashFiles('extended/window/**/module.yaml', 'extended/window/libs.versions.toml', 'extended/window/kotlin') }}
          restore-keys: |
            extended-window-scene-${{ runner.os }}-

      # The scene compiles against this fork's foundation and UI, which nothing publishes.
      - name: Free disk space for the Linux Compose build
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /usr/local/julia* /opt/microsoft /opt/google
          df -h /

      - name: The X11, GL, fontconfig and FreeType development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxext-dev libgl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev

      - name: This fork's Compose for the JVM and Linux x64
        uses: ./.github/actions/fork-compose
        with:
          targets: desktop linuxX64

      # The toolchain resolves every platform a module declares, even when asked to build one,
      # and the fork's macosArm64 Compose is built only on a Mac. On this runner the scene is
      # the JVM and Linux x64 module it is built and tested as; the checkout is this job's own.
      - name: The scene for this runner's platforms
        run: |
          sed -i '/native\/macos/d' project.yaml
          sed -i 's/^  platforms: \[.*\]$/  platforms: [ jvm, linuxX64 ]/' scene/module.yaml
          grep -qx '  platforms: \[ jvm, linuxX64 \]' scene/module.yaml

      - name: Test (jvm)
        run: ./kotlin test -p jvm -m scene

      - name: Build (linuxX64)
        run: ./kotlin build -p linuxX64 -m scene
