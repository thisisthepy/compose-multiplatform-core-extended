# extended/window/native/macos: build the Kotlin/Native macOS window and run its tests.
#
# A standalone Amper project with its own wrapper, unrelated to the Gradle build at the root
# of this repository, so only that directory is checked out.

name: Extended window (macOS)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - extended/window/**
      - .github/workflows/extended-window-macos.yml
      - .github/actions/fork-compose/**
      - extended/compose/**
  push:
    branches:
      - extended
    paths:
      - extended/window/**
      - .github/workflows/extended-window-macos.yml
      - .github/actions/fork-compose/**
      - extended/compose/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  corner-radius:
    # The table has a row per macOS release, so each release with a runner is measured.
    name: Corner radius (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-14, macos-15, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: extended/window
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: extended/window
          filter: blob:none

      - name: The corner radius table matches the corner macOS draws
        run: ./scripts/check-macos-corner-radius.sh

  build:
    name: Window macosArm64
    runs-on: macos-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: extended/window
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            extended/window
            .github/actions
          filter: blob:none

      - name: Cache the Kotlin toolchain, konan and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.konan
            ~/.m2/repository
          key: extended-window-macos-${{ runner.os }}-${{ hashFiles('extended/window/**/module.yaml', 'extended/window/libs.versions.toml', 'extended/window/kotlin') }}
          restore-keys: |
            extended-window-macos-${{ runner.os }}-

      # native/macos compiles against this fork's foundation and UI, which nothing publishes.
      - name: This fork's Compose for macosArm64
        uses: ./.github/actions/fork-compose
        with:
          targets: desktop macosArm64

      # The scene declares other platforms too, which this runner builds no Compose for.
      - name: The scene for this runner's platforms
        run: |
          sed -i '' 's/^  platforms: \[.*\]$/  platforms: [ jvm, macosArm64 ]/' scene/module.yaml
          grep -qx '  platforms: \[ jvm, macosArm64 \]' scene/module.yaml

      - name: The window code calls no private AppKit API
        run: ./scripts/check-no-private-api.sh

      - name: Build
        run: |
          ./kotlin build -p macosArm64 -m scene
          ./kotlin build -p macosArm64 -m macos

      - name: Check that every window klib has a globally unique name
        run: ./scripts/check-klib-names.sh --built .

      - name: Test
        run: ./kotlin test -p macosArm64 -m macos

      - name: What the test link was given (on failure)
        if: failure()
        run: |
          ./kotlin show dependencies --module macos --platform macosArm64 || ./kotlin show dependencies --module macos || true
          find ~/Library/Caches/JetBrains/Kotlin/.m2.cache/org/jetbrains/compose -name '*.klib' | sort
          find ~/.m2/repository -path '*animation-core*' \( -name '*.klib' -o -name '*.module' \) | sort
          find build -type f \( -name '*.args' -o -name '*argfile*' -o -name '*.rsp' \) 2>/dev/null | head -20 |
            while read -r f; do echo "== $f"; grep -n 'animation' "$f" | head -20; done
          find ~/.cache/JetBrains ~/Library/Caches/JetBrains -name '*.klib' -path '*animation*' 2>/dev/null | head -20
