# Builds skiko-awt with the AWT switch (extended/skiko/awt) and checks the switch is in the jar.
name: extended skiko awt jar

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'extended/skiko/**'
      - '.github/workflows/extended-skiko-awt-jar.yml'
  push:
    branches: [ extended ]
    paths:
      - 'extended/skiko/**'
      - '.github/workflows/extended-skiko-awt-jar.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: extended/skiko

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and publish skiko-awt
        run: ./extended/skiko/build-skiko-awt.sh "$RUNNER_TEMP/skiko-awt"

      - name: Setup.init reaches the look and feel only through the switch
        run: |
          set -euo pipefail
          jar="$HOME/.m2/repository/org/thisisthepy/compose/skiko/skiko-awt/1.11.1-ext.2/skiko-awt-1.11.1-ext.2.jar"
          init="$(javap -c -p -classpath "$jar" org.jetbrains.skiko.Setup)"
          grep -q 'AwtSwitch' <<< "$init" || { echo "Setup.init does not read AwtSwitch" >&2; exit 1; }
          javap -c -p -classpath "$jar" org.jetbrains.skiko.AwtSwitch | grep -q 'compose.awt'

      - name: Published under org.thisisthepy, standing in for JetBrains' skiko-awt, natives at 0.144.6
        run: |
          set -euo pipefail
          if [ -e "$HOME/.m2/repository/org/jetbrains/skiko/skiko-awt" ]; then
            echo "the patched skiko-awt was left at JetBrains' coordinates" >&2
            exit 1
          fi
          base="$HOME/.m2/repository/org/thisisthepy/compose/skiko/skiko-awt/1.11.1-ext.2"
          grep -q '<groupId>org.thisisthepy.compose.skiko</groupId>' "$base/skiko-awt-1.11.1-ext.2.pom"
          grep -q 'Upstream version: 0.144.6' "$base/skiko-awt-1.11.1-ext.2.pom"
          python3 -I - "$base/skiko-awt-1.11.1-ext.2.module" <<'PY'
          import json, sys
          metadata = json.load(open(sys.argv[1]))
          component = {k: metadata["component"][k] for k in ("group", "module", "version")}
          assert component == {"group": "org.thisisthepy.compose.skiko", "module": "skiko-awt", "version": "1.11.1-ext.2"}, metadata["component"]
          assert "url" not in metadata["component"], metadata["component"]
          for variant in metadata["variants"]:
              names = {(c["group"], c["name"]) for c in variant.get("capabilities", [])}
              assert names == {("org.thisisthepy.compose.skiko", "skiko-awt")}, (variant["name"], names)
          runtime = [d for v in metadata["variants"] for d in v.get("dependencies", [])
                     if d["module"].startswith("skiko-awt-runtime")]
          for dependency in runtime:
              assert dependency["group"] == "org.jetbrains.skiko" and dependency["version"]["requires"] == "0.144.6", dependency
          print("ok:", len(runtime), "runtime dependencies at 0.144.6, and only its own capability on every variant")
          PY
