# Builds skiko-awt with the AWT switch (extended/skiko/awt) and checks the switch is in the jar.
name: extended skiko awt jar

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'extended/skiko/**'
      - '.github/workflows/extended-skiko-awt-jar.yml'
  push:
    branches: [ extended ]
    paths:
      - 'extended/skiko/**'
      - '.github/workflows/extended-skiko-awt-jar.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: extended/skiko

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and publish skiko-awt
        run: ./extended/skiko/build-skiko-awt.sh "$RUNNER_TEMP/skiko-awt"

      - name: Setup.init reaches the look and feel only through the switch
        run: |
          set -euo pipefail
          jar="$HOME/.m2/repository/org/jetbrains/skiko/skiko-awt/0.144.6/skiko-awt-0.144.6.jar"
          init="$(javap -c -p -classpath "$jar" org.jetbrains.skiko.Setup)"
          grep -q 'AwtSwitch' <<< "$init" || { echo "Setup.init does not read AwtSwitch" >&2; exit 1; }
          javap -c -p -classpath "$jar" org.jetbrains.skiko.AwtSwitch | grep -q 'compose.awt'

      - name: With compose.awt=false the loader loads no java.awt class
        run: |
          set -euo pipefail
          # Reuses the check of the AWT-free loader, with this jar in place of JetBrains'.
          cat extended/skiko/tests/LoaderCheck.java | head -20 > /dev/null
