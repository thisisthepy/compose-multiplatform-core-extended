# extended/packaging: validates the shared packaging templates.
name: Extended packaging

on:
  workflow_call: {}

permissions:
  contents: read

jobs:
  templates:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: extended/packaging

      - name: Templates are well-formed and carry their placeholders
        run: python3 extended/packaging/scripts/validate-templates.py
