# The scripts that publish this fork's Compose locally and check what they published, tested
# against made-up repositories. Nothing is built here: the window workflows run the real thing
# through .github/actions/fork-compose.
name: Extended coordinates

on:
  workflow_call: {}

permissions:
  contents: read

env:
  # Google's mirror of Maven Central, asked before Central by buildSrc/repos.gradle: Central
  # answers runners that share an address with 429 Too Many Requests (fork-train-16).
  COMPOSE_MAVEN_MIRROR: https://maven-central.storage-download.googleapis.com/maven2

jobs:
  scripts:
    name: Publish and check scripts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            extended/compose
            extended/skiko
            buildSrc/repos.gradle
            gradlew
            gradle/wrapper
            .github/workflows
          sparse-checkout-cone-mode: false
          filter: blob:none

      - name: check-local.py and publish-local.sh --list
        run: extended/compose/tests/check-local.test.sh

      - name: retry-network.sh
        run: extended/compose/tests/retry-network.test.sh

      # ci.yml's macOS arm64 cells against their budget, and the compile-only jobs on Intel
      # (PyYAML is the runner's system python3-yaml).
      - name: macOS runners
        run: python3 -I extended/compose/tests/macos_runners_test.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: The Maven mirror in buildSrc/repos.gradle
        run: extended/compose/tests/maven-mirror.test.sh

      - name: Every workflow running the Gradle build names the Maven mirror
        run: extended/compose/tests/ci-mirror.test.sh

      - name: The web test compiles retry a call the network failed
        run: extended/compose/tests/web-compile-retry.test.sh

      - name: republish-skiko-mingw.py
        run: extended/skiko/tests/republish-skiko-mingw.test.sh

      - name: republish-skiko-awt.py and repoint-desktop-skiko.py
        run: extended/skiko/tests/republish-skiko-awt.test.sh
