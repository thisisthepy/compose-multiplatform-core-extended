# Builds and tests extended/window/windows-shared with MSVC: the C window both the
# GraalVM image and the Kotlin/Native (MinGW) renderer link. Compiling with cl is the
# point, because the application is an MSVC executable and cl is the compiler that has
# to accept this file.
name: extended window windows-shared

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'extended/window/**'
      - '.github/workflows/extended-window-windows-shared.yml'
  push:
    branches: [ extended ]
    paths:
      - 'extended/window/**'
      - '.github/workflows/extended-window-windows-shared.yml'

concurrency:
  group: extended-window-windows-shared-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  msvc:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: extended/window/windows-shared

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Swapchain creation stays in one function
        shell: bash
        run: |
          count=$(grep -c 'CreateSwapChainForHwnd(' extended/window/windows-shared/c/win32_window.c)
          test "$count" = 1 || { echo "expected one CreateSwapChainForHwnd call, found $count"; exit 1; }

      - name: Compile the window and the toasts
        working-directory: extended/window/windows-shared
        run: |
          mkdir out
          cl /nologo /c /O2 /std:c11 /W3 /Foout\win32_window.obj c\win32_window.c
          cl /nologo /c /O2 /std:c11 /W3 /Foout\win32_notifications.obj c\win32_notifications.c
          cl /nologo /c /O2 /std:c11 /W3 /Foout\win32_platform.obj c\win32_platform.c

      - name: Package the static library
        working-directory: extended/window/windows-shared
        run: lib /nologo /OUT:out\dxc_win32_window.lib out\win32_window.obj out\win32_notifications.obj out\win32_platform.obj

      - name: Link and run the check against the library
        working-directory: extended/window/windows-shared
        run: |
          cl /nologo /std:c11 /Ic /Foout\ test\win32_shared_test.c /Feout\win32_shared_test.exe /link out\dxc_win32_window.lib d3d12.lib dxgi.lib dxguid.lib user32.lib gdi32.lib uiautomationcore.lib oleaut32.lib imm32.lib runtimeobject.lib ole32.lib shell32.lib advapi32.lib
          out\win32_shared_test.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-shared-msvc
          path: |
            extended/window/windows-shared/out/dxc_win32_window.lib
            extended/window/windows-shared/c/win32_window.h

  kotlin:
    name: windows-shared Kotlin (compile and test)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: extended/window
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: extended/window
          filter: blob:none

      - name: The module names no java.awt and uses no reflection
        run: |
          if grep -rEn 'java\.awt|javax\.swing|sun\.awt' windows-shared/src windows-shared/module.yaml; then
            echo "windows-shared must not reference java.awt" >&2
            exit 1
          fi
          if grep -rEn 'java\.lang\.reflect|Class\.forName|::class\.java|getDeclared|\.javaClass' windows-shared/src; then
            echo "upcalls go through the CEntryPointLiteral table, not reflection" >&2
            exit 1
          fi

      - name: Compile and test
        run: |
          ./kotlin build -p jvm -m windows-shared
          ./kotlin test -p jvm -m windows-shared
