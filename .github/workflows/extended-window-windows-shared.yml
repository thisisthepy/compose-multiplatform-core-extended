# Builds and tests extended/window/windows-shared: the one C Win32 window that both the
# GraalVM native image and Kotlin/Native applications link, and the Kotlin/Native layer over it.
#
# The C is compiled with MSVC (cl), because every Windows application that links it is an
# MSVC executable and cl is the compiler that has to accept this file.
#
# mingwX64 below is only the name of Kotlin/Native's Windows target. The job compiles the
# klib and runs its tests, which touch no window and link none of the C. It is not a way to
# produce an application: the final link of any Windows executable is MSVC's alone, and that
# path belongs to the Compose Gradle plugin, not to a MinGW link here. Nothing in this
# workflow links the window's object with MinGW or ships a MinGW-linked binary.
name: Extended window windows-shared

on:
  workflow_dispatch:
  pull_request:
    paths:
      - extended/window/common/**
      - extended/window/windows-shared/**
      - extended/window/project.yaml
      - extended/window/scripts/**
      - .github/workflows/extended-window-windows-shared.yml
  push:
    branches:
      - extended
    paths:
      - extended/window/common/**
      - extended/window/windows-shared/**
      - extended/window/project.yaml
      - extended/window/scripts/**
      - .github/workflows/extended-window-windows-shared.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  msvc:
    name: windows-shared C (MSVC compile and test)
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: cmd
        working-directory: extended/window/windows-shared
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: extended/window/windows-shared

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: The header declares every function the C exports, and nothing else
        shell: bash
        run: |
          set -euo pipefail
          exported() {
            grep -hoE '^(int32_t|int64_t|void) (dxc_native|dxc_notify)_[a-z0-9_]+\(' c/win32_window.c c/win32_file_dialog.c c/win32_notifications.c |
              sed -E 's/^[a-z0-9_]+ //; s/\($//' | sort -u
          }
          declared() {
            grep -oE '\b(dxc_native|dxc_notify)_[a-z0-9_]+\(' cinterop/include/win32_window.h |
              sed -E 's/\($//' | sort -u
          }
          diff <(exported) <(declared) || {
            echo "cinterop/include/win32_window.h and the C files disagree (< only in C, > only in the header)" >&2
            exit 1
          }

      - name: The resize path keeps its proof lines and its one swapchain
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'resize-proof step %dx%d presents=%d child_visible=%d blit=%d validated=%d' c/win32_window.c
          grep -q 'compose-rust: metrics memory %s working_set_mb=' c/win32_window.c
          grep -q 'IDXGIOutputDuplication_AcquireNextFrame' c/win32_window.c
          count=$(grep -c 'CreateSwapChainForHwnd(' c/win32_window.c)
          test "$count" = 1 || { echo "expected one CreateSwapChainForHwnd call, found $count" >&2; exit 1; }

      - name: Compile the window, the file dialogs and the toasts
        run: |
          mkdir out
          cl /nologo /c /O2 /std:c11 /W3 /Foout\win32_window.obj c\win32_window.c || exit /b 1
          cl /nologo /c /O2 /std:c11 /W3 /Foout\win32_file_dialog.obj c\win32_file_dialog.c || exit /b 1
          cl /nologo /c /O2 /std:c11 /W3 /Foout\win32_notifications.obj c\win32_notifications.c || exit /b 1

      - name: Package the static library
        run: lib /nologo /OUT:out\dxc_win32_window.lib out\win32_window.obj out\win32_file_dialog.obj out\win32_notifications.obj

      # The renderer's one native image carries the X11 window's calls on every desktop and
      # links every C function its reachable code names, so the Windows library defines them
      # too. On Windows a missing one is a DLL that does not link.
      - name: The X11 window's calls the image carries resolve here too
        shell: bash
        run: |
          set -euo pipefail
          symbols="$(MSYS_NO_PATHCONV=1 dumpbin /nologo /symbols out/dxc_win32_window.lib | tr -d '\r')"
          for name in wake window_origin window_focused ime_reset resize_serial window_server_size debug_resize frame_time_nanos window_title_bar window_chrome accessibility_active take_accessibility_argument accessibility_snapshot ax_api_probe; do
            grep -qE "External +\| dxc_native_$name\$" <<<"$symbols" || {
              echo "win32_window.c defines no dxc_native_$name" >&2
              exit 1
            }
          done

      - name: Link and run the check against the library
        run: |
          cl /nologo /std:c11 /Ic /Icinterop\include /Foout\ c\test\win32_shared_test.c /Feout\win32_shared_test.exe /link out\dxc_win32_window.lib d3d12.lib dxgi.lib dxguid.lib user32.lib gdi32.lib uiautomationcore.lib oleaut32.lib imm32.lib runtimeobject.lib ole32.lib shell32.lib advapi32.lib || exit /b 1
          out\win32_shared_test.exe

      - uses: actions/upload-artifact@v4
        with:
          name: windows-shared-msvc
          path: |
            extended/window/windows-shared/out/dxc_win32_window.lib
            extended/window/windows-shared/cinterop/include/win32_window.h

      # The window on this runner's desktop, with a stand-in renderer, read back frame by frame
      # through DXGI desktop duplication (c/test/win32_resize_probe.c). FR-19.8 criterion 4,
      # compose-rust#684: no composed frame shows the window at one size with a picture drawn
      # for another.
      - name: Build the resize probe
        run: |
          cl /nologo /std:c11 /W3 /Ic /Icinterop\include /Foout\ c\test\win32_resize_probe.c /Feout\win32_resize_probe.exe /link out\dxc_win32_window.lib d3d12.lib d3d11.lib dxgi.lib dxguid.lib dwmapi.lib user32.lib gdi32.lib uiautomationcore.lib oleaut32.lib imm32.lib runtimeobject.lib ole32.lib shell32.lib advapi32.lib || exit /b 1

      # For comparison, not a gate: the size drawn in WM_SIZE after the window took it, as
      # before, and resize frames on the GPU, where the frame cannot be drawn ahead.
      - name: Resize probe, maximise, restore and snap, drawn after the window took the size (comparison)
        shell: bash
        run: |
          DXC_RESIZE_PREDRAW=0 PROBE_SAVE='out\frames-states-after' ./out/win32_resize_probe.exe states 2>&1 | tee out/probe-states-after.log || true
          DXC_RESIZE_PREDRAW=0 PROBE_DRAW_MS=30 PROBE_SAVE='out\frames-states-after-30ms' ./out/win32_resize_probe.exe states 2>&1 | tee out/probe-states-after-30ms.log || true

      - name: Resize probe, maximise, restore and snap, resize frames on the GPU (comparison)
        shell: bash
        run: |
          PROBE_RASTER=0 PROBE_SAVE='out\frames-states-gpu' ./out/win32_resize_probe.exe states 2>&1 | tee out/probe-states-gpu.log || true

      # How far the edge lags the pointer in a right-edge drag, with a frame that costs
      # nothing and with one that costs 30 ms (about what Skia's raster backend takes on this
      # runner). Measured, not a gate.
      - name: Resize probe, right-edge drag
        shell: bash
        run: |
          PROBE_SAVE='out\frames-drag' ./out/win32_resize_probe.exe drag 2>&1 | tee out/probe-drag.log || true
          PROBE_DRAW_MS=30 ./out/win32_resize_probe.exe drag 2>&1 | tee out/probe-drag-30ms.log || true

      # With a frame that costs nothing and with one that costs 30 ms. Not a gate yet: after
      # restore, left-half snap and back one composed frame still shows the old picture, while
      # the GPU takes over again (compose-rust#684). The verdict lines are what is read.
      - name: Resize probe, maximise, restore and snap
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          status=0
          PROBE_SAVE='out\frames-states' ./out/win32_resize_probe.exe states 2>&1 | tee out/probe-states.log || status=1
          PROBE_DRAW_MS=30 PROBE_SAVE='out\frames-states-30ms' ./out/win32_resize_probe.exe states 2>&1 | tee out/probe-states-30ms.log || status=1
          exit $status

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-shared-resize-probe
          if-no-files-found: ignore
          path: |
            extended/window/windows-shared/out/probe-*.log
            extended/window/windows-shared/out/frames-*/

  kotlin:
    name: windows-shared Kotlin/Native (mingwX64 klib build and test)
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: extended/window
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: extended/window

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: The Kotlin names no toolkit and no Compose, and uses no reflection
        run: |
          if grep -rEn 'java\.awt|javax\.swing|androidx\.compose|kotlin\.reflect' windows-shared/src windows-shared/test; then
            echo "windows-shared must name no toolkit and no Compose, and use no reflection" >&2
            exit 1
          fi

      - name: The klib calls the C through cinterop, not by symbol name
        run: |
          if grep -rn '@SymbolName' windows-shared/src; then
            echo "call the window through the cinterop bindings of cinterop/win32_window.def" >&2
            exit 1
          fi

      # From PowerShell: the toolchain's wrapper on Windows is kotlin.bat, and run from Git
      # Bash it would unpack with Git's tar, which reads C:\ as a remote host.
      - name: Build
        shell: pwsh
        run: |
          .\kotlin.bat build -m windows-shared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Check that every window klib has a globally unique name
        run: ./scripts/check-klib-names.sh --built .

      - name: Test
        shell: pwsh
        run: |
          .\kotlin.bat test -m windows-shared
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # The way a consumer takes it: org.thisisthepy.compose.window:windows-shared from the
      # local Maven repository, beside common. Only the two modules this runner builds.
      - name: Publish to the local repository
        shell: pwsh
        run: |
          Copy-Item project.yaml project.yaml.all
          Set-Content project.yaml "modules:`n  - common`n  - windows-shared`n"
          .\kotlin.bat publish mavenLocal
          $status = $LASTEXITCODE
          Copy-Item project.yaml.all project.yaml -Force
          if ($status -ne 0) { exit $status }
          Get-ChildItem -Recurse "$HOME\.m2\repository\org\thisisthepy\compose\window" -Filter *.klib |
            ForEach-Object { $_.FullName }
