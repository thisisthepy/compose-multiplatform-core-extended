# The window modules under extended/window: build and test them.
#
# `native/linux` compiles against Compose for Kotlin/Native Linux, which JetBrains does not
# publish, so the job publishes this fork's Compose modules to the local Maven repository
# (.github/actions/fork-compose, cached until the Compose sources change), and then builds
# and tests the window project against them. The
# inherited upstream workflows do not build extended/window and are not the gate for it.

name: Extended window linux

on:
  workflow_dispatch:
  pull_request:
    paths:
      - extended/window/common/**
      - extended/window/native/linux/**
      - extended/window/scene/**
      - extended/window/project.yaml
      - extended/window/scripts/**
      - .github/workflows/extended-window-linux.yml
      - .github/actions/fork-compose/**
      - extended/compose/**
  push:
    branches:
      - extended
    paths:
      - extended/window/common/**
      - extended/window/native/linux/**
      - extended/window/scene/**
      - extended/window/project.yaml
      - extended/window/scripts/**
      - .github/workflows/extended-window-linux.yml
      - .github/actions/fork-compose/**
      - extended/compose/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux:
    name: native/linux (Linux x64 test, arm64 build)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /usr/local/julia* /opt/microsoft /opt/google
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Kotlin/Native and the Kotlin toolchain
        uses: actions/cache@v4
        with:
          path: |
            ~/.konan
            ~/.cache/JetBrains/Kotlin
          key: extended-window-linux-${{ hashFiles('extended/window/**/module.yaml', 'extended/window/libs.versions.toml', 'extended/window/kotlin') }}
          restore-keys: |
            extended-window-linux-

      - name: Install the X11, GL, fontconfig and FreeType development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxext-dev libgl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev xvfb openbox xdotool x11-utils

      - name: This fork's Compose for Kotlin/Native Linux
        uses: ./.github/actions/fork-compose
        with:
          targets: linuxX64 linuxArm64

      # The toolchain resolves every platform a module declares, even when asked to build one,
      # and the scene declares the JVM and macOS too, whose Compose is not built here. On this
      # runner it is the Linux module it is for, and the project is the Linux modules: the
      # GraalVM ones depend on the scene's JVM side.
      - name: The Linux modules, with the scene as a Linux module
        working-directory: extended/window
        run: |
          printf 'modules:\n  - common\n  - scene\n  - native/linux\n' > project.yaml
          cat project.yaml
          perl -0pi -e 's/^  platforms: \[.*\]$/  platforms: [ linuxX64, linuxArm64 ]/m' scene/module.yaml
          grep -q '^  platforms: \[ linuxX64, linuxArm64 \]$' scene/module.yaml

      - name: Build x64
        working-directory: extended/window
        run: ./kotlin build -p linuxX64

      - name: Check that every window klib has a globally unique name
        working-directory: extended/window
        run: ./scripts/check-klib-names.sh --built .

      # Compiled only: the cross compile sysroot has no arm64 libX11, so the arm64 test
      # executable cannot be linked on an x86-64 runner.
      - name: Compile arm64
        working-directory: extended/window
        run: ./kotlin task :linux:compileLinuxArm64Debug

      - name: Test (x64, under a virtual display)
        working-directory: extended/window
        # WmDragTest starts openbox for its own drag and stops it again (scripts/wm-drag.sh).
        env:
          WM_DRAG_SCRIPT: ${{ github.workspace }}/extended/window/scripts/wm-drag.sh
        run: xvfb-run -a ./kotlin test -p linuxX64
