# Desktop test for the AWT-free pointer icons, with no Android SDK.

name: Extended pointer icon test

on:
  workflow_dispatch:
  pull_request:
    branches:
      - extended
    paths:
      - compose/ui/ui/src/desktop*/**
      - compose/ui/ui/api/desktop/**
      - .github/workflows/extended-pointericon-test.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Retry transient dependency download failures (TLS handshake resets, timeouts) with
  # backoff. These are JVM system properties read by Gradle's repository transport, so
  # they must reach the daemon and Amper's JVMs; JAVA_TOOL_OPTIONS is inherited by all.
  JAVA_TOOL_OPTIONS: >-
    -Dorg.gradle.internal.repository.max.retries=6
    -Dorg.gradle.internal.repository.initial.backoff=1000
    -Dorg.gradle.internal.http.connectionTimeout=120000
    -Dorg.gradle.internal.http.socketTimeout=120000

jobs:
  test:
    name: AWT-free pointer icons
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'corretto'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Run test
        run: ./gradlew :compose:ui:ui:desktopTest --tests '*AwtFreePointerIconTest*' --no-daemon --stacktrace
