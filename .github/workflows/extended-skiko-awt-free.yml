# Checks that skiko loads and renders for an embedder with no AWT: the JVM loader maps no
# libjawt and loads no java.awt class (extended/skiko/tests/LoaderCheck.java), and the static
# archive built with --no-jawt refers to nothing in JAWT.
name: extended skiko awt-free

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'extended/skiko/**'
      - '.github/workflows/extended-skiko-awt-free.yml'
  push:
    branches: [ extended ]
    paths:
      - 'extended/skiko/**'
      - '.github/workflows/extended-skiko-awt-free.yml'

permissions:
  contents: read

env:
  SKIKO_VERSION: 0.144.6
  KOTLIN_VERSION: 2.2.20
  COROUTINES_VERSION: 1.10.2

jobs:
  loader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: extended/skiko

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Fetch skiko and its two dependencies
        run: |
          set -euo pipefail
          mkdir libs
          central=https://repo1.maven.org/maven2
          curl -fsSL -o libs/skiko-awt.jar "$central/org/jetbrains/skiko/skiko-awt/$SKIKO_VERSION/skiko-awt-$SKIKO_VERSION.jar"
          curl -fsSL -o libs/skiko-runtime.jar "$central/org/jetbrains/skiko/skiko-awt-runtime-linux-x64/$SKIKO_VERSION/skiko-awt-runtime-linux-x64-$SKIKO_VERSION.jar"
          curl -fsSL -o libs/kotlin-stdlib.jar "$central/org/jetbrains/kotlin/kotlin-stdlib/$KOTLIN_VERSION/kotlin-stdlib-$KOTLIN_VERSION.jar"
          curl -fsSL -o libs/coroutines.jar "$central/org/jetbrains/kotlinx/kotlinx-coroutines-core-jvm/$COROUTINES_VERSION/kotlinx-coroutines-core-jvm-$COROUTINES_VERSION.jar"
          unzip -o -q libs/skiko-runtime.jar 'libskiko-linux-x64.so' -d libs

      - name: The native library does not link libjawt
        run: |
          if readelf -d libs/libskiko-linux-x64.so | grep NEEDED | grep -E 'jawt|awt'; then
            echo "libskiko-linux-x64.so links AWT" >&2
            exit 1
          fi
          readelf -d libs/libskiko-linux-x64.so | grep NEEDED

      - name: Load skiko and check that AWT stays out
        run: |
          set -euo pipefail
          java -Djava.awt.headless=true -Xlog:class+load:file=class-load.log \
            -cp 'libs/*' extended/skiko/tests/LoaderCheck.java class-load.log

  static-archive:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-14 ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: extended/skiko

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install the headers skiko compiles against
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxinerama-dev libfontconfig1-dev libdbus-1-dev

      - name: Build the archive with no JAWT
        run: |
          bash extended/skiko/build-skiko-static-jvm.sh --no-jawt "$RUNNER_TEMP/skiko-static"
