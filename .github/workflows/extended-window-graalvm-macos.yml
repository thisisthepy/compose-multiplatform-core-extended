# extended/window/graalvm/graalvm-macos: the AppKit window for the GraalVM native-image path.
#
# Compiles appkit_window.m into a static library, runs the pure C tests of the frame time
# it hands each frame, compiles the Kotlin wrapper and runs its tests, and fails if the module names
# java.awt or if the generated upcall table is stale.

name: Extended window graalvm macos

on:
  workflow_dispatch:
  pull_request:
    paths:
      - extended/window/**
      - .github/actions/fork-compose/**
      - .github/workflows/extended-window-graalvm-macos.yml
  push:
    branches:
      - extended
    paths:
      - extended/window/**
      - .github/actions/fork-compose/**
      - .github/workflows/extended-window-graalvm-macos.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: graalvm/graalvm-macos (compile and test)
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: extended/window
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            extended/window
            extended/compose
            .github/actions
          filter: blob:none

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: The module names no java.awt
        run: |
          if grep -rEn 'java\.awt|javax\.swing|sun\.awt' graalvm/graalvm-macos/src graalvm/graalvm-macos/module.yaml; then
            echo "graalvm/graalvm-macos must not reference java.awt" >&2
            exit 1
          fi

      - name: The window code calls no private AppKit API
        run: ./scripts/check-no-private-api.sh

      - name: The upcall table is generated and current
        run: graalvm/graalvm-macos/tools/gen-upcalls.sh --check

      - name: No runtime reflection in the module
        run: |
          if grep -rEn 'java\.lang\.reflect|Class\.forName|::class\.java|getDeclared|\.javaClass' graalvm/graalvm-macos/src; then
            echo "upcalls go through the generated table, not reflection" >&2
            exit 1
          fi

      - name: Compile appkit_window.m into a static library
        run: |
          mkdir -p build/native
          for arch in arm64 x86_64; do
            cc -c -O2 -fobjc-arc -arch "$arch" -o "build/native/appkit_window-$arch.o" graalvm/graalvm-macos/native/appkit_window.m
          done
          lipo -create build/native/appkit_window-arm64.o build/native/appkit_window-x86_64.o -output build/native/appkit_window.o
          ar rcs build/native/libappkit_window.a build/native/appkit_window.o
          nm build/native/libappkit_window.a | grep -E ' T _dxc_native_(window_open|poll_event|set_draw_callback|frame_time_nanos)'

      - name: The X11 window's calls the image carries resolve here too
        # The renderer's native image carries graalvm-linux on macOS as well, and links every C
        # function its reachable code names. These are the X11 calls it reaches; macOS binds
        # lazily, so one missing here is a crash at its first call rather than a link error.
        run: |
          for name in wake window_origin window_focused ime_reset resize_serial window_server_size debug_resize; do
            nm build/native/libappkit_window.a | grep -q " T _dxc_native_$name\$" || {
              echo "appkit_window.m defines no dxc_native_$name" >&2
              exit 1
            }
          done

      - name: The frame time follows the display link's schedule
        run: |
          cc -O2 -Wall -Werror -o build/native/appkit_frame_time_test graalvm/graalvm-macos/native/appkit_frame_time_test.c
          build/native/appkit_frame_time_test

      - name: The window's title bar styles and accessibility tree on a real window
        # Opens a Normal, a Simple and a System window and checks the system buttons, the
        # content under the bar, the hidden title and the bar heights, then pushes records as
        # the Kotlin side writes them and asks the view as a reader does.
        run: |
          cc -O0 -fobjc-arc -o build/native/appkit_window_test graalvm/graalvm-macos/native/appkit_window_test.m \
            -framework AppKit -framework Metal -framework QuartzCore -framework CoreVideo \
            -framework Carbon -framework ApplicationServices
          build/native/appkit_window_test

      - name: Cache the Kotlin toolchain and Maven dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/JetBrains/Kotlin
            ~/.m2/repository
          key: extended-window-${{ runner.os }}-${{ hashFiles('extended/window/**/module.yaml', 'extended/window/kotlin') }}
          restore-keys: |
            extended-window-${{ runner.os }}-

      # MetalWindowSurface and GlWindowSurface compile against the scene module, which compiles
      # against this fork's foundation and UI. Nothing public has those, so they are published
      # here first, for the JVM only.
      - name: This fork's Compose for the JVM
        uses: ./.github/actions/fork-compose
        with:
          targets: desktop

      # The toolchain resolves every platform a module declares, and the scene declares
      # macosArm64 too. These modules are JVM ones, so the scene is built as one here.
      - name: The scene as a JVM module on this runner
        working-directory: extended/window
        shell: bash
        run: |
          perl -0pi -e 's/^  platforms: \[.*\]$/  platforms: [ jvm ]/m' scene/module.yaml
          grep -q '^  platforms: \[ jvm \]$' scene/module.yaml

      - name: Compile the Kotlin wrapper
        run: ./kotlin build -p jvm -m graalvm-macos

      - name: Test
        run: ./kotlin test -p jvm -m graalvm-macos
