# The window modules published to the local Maven repository, the way compose-rust consumes
# them. Each runner publishes the modules it can build: the macOS one adds native/macos and
# the Ubuntu one adds native/linux. Both compile against this fork's Compose, which nothing
# publishes, so each runner publishes it to the local Maven repository first
# (.github/actions/fork-compose).
name: Extended window publish

on:
  workflow_dispatch:
  pull_request:
    paths:
      - extended/window/**
      - .github/workflows/extended-window-publish.yml
      - .github/actions/fork-compose/**
      - extended/compose/**
  push:
    branches:
      - extended
    paths:
      - extended/window/**
      - .github/workflows/extended-window-publish.yml
      - .github/actions/fork-compose/**
      - extended/compose/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            modules: "common scene native/macos graalvm/graalvm-macos graalvm/graalvm-linux"
            compose: "desktop macosArm64"
          # The scene is published from macOS only: it compiles against this fork's Compose
          # for macosArm64 as well as the JVM, and only a Mac builds the former.
          - os: ubuntu-24.04
            modules: "common graalvm/graalvm-macos graalvm/graalvm-linux"
            compose: "linuxX64 linuxArm64"
            compose_linux: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        working-directory: extended/window
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            extended/window
            .github/actions

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Free disk space
        if: ${{ matrix.compose_linux }}
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /usr/local/julia* /opt/microsoft /opt/google
          df -h /

      - name: Install the X11, GL, fontconfig and FreeType development libraries
        if: ${{ matrix.compose_linux }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxext-dev libgl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev

      - name: This fork's Compose
        uses: ./.github/actions/fork-compose
        with:
          targets: ${{ matrix.compose }}

      - name: Publish to the local repository
        shell: bash
        run: |
          set -euo pipefail
          cp project.yaml project.yaml.all
          printf 'modules:\n' > project.yaml
          for m in ${{ matrix.modules }}; do printf '  - %s\n' "$m" >> project.yaml; done
          cat project.yaml
          ./kotlin publish mavenLocal
          cp project.yaml.all project.yaml

      - name: Publish native/linux, one architecture at a time
        if: ${{ matrix.compose_linux }}
        shell: bash
        run: ./scripts/publish-native-linux.sh

      - name: What was published
        shell: bash
        run: |
          find ~/.m2/repository/org/thisisthepy/compose/window -name '*.pom' -o -name '*.jar' -o -name '*.klib' -o -name '*.module' | sort
          test -n "$(find ~/.m2/repository/org/thisisthepy/compose/window -name '*.pom')"

      - name: What a consumer resolves for native-linux
        if: ${{ matrix.compose_linux }}
        shell: bash
        run: |
          set -euo pipefail
          base=~/.m2/repository/org/thisisthepy/compose/window
          for arch in linuxx64 linuxarm64; do
            dir="$base/native-linux-$arch/0.1.0"
            for file in "native-linux-$arch-0.1.0.klib" "native-linux-$arch-0.1.0.module" "native-linux-$arch-0.1.0.pom"; do
              test -s "$dir/$file" || { echo "missing $dir/$file" >&2; exit 1; }
            done
            echo "ok    native-linux-$arch is published as its own coordinate"
          done
          root="$base/native-linux/0.1.0/native-linux-0.1.0.module"
          test -s "$root" || { echo "missing the root module $root" >&2; exit 1; }
          cat "$root"
          for arch in linuxx64 linuxarm64; do
            grep -qi "native-linux-$arch" "$root" || { echo "the root module does not list $arch" >&2; exit 1; }
          done
          echo "ok    the root module lists both architectures"
