# The window modules published to the local Maven repository, the way compose-rust consumes
# them. Each runner publishes the modules it can build: the macOS one adds native/macos.
name: Extended window publish

on:
  workflow_dispatch:
  pull_request:
    paths:
      - extended/window/**
      - .github/workflows/extended-window-publish.yml
      - .github/actions/fork-compose/**
      - extended/compose/**
  push:
    branches:
      - extended
    paths:
      - extended/window/**
      - .github/workflows/extended-window-publish.yml
      - .github/actions/fork-compose/**
      - extended/compose/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            modules: "common scene native/macos graalvm/graalvm-macos graalvm/graalvm-linux"
            compose: "desktop macosArm64"
          # The scene is published from macOS only: it compiles against this fork's Compose
          # for macosArm64 as well as the JVM, and only a Mac builds the former.
          - os: ubuntu-24.04
            modules: "common graalvm/graalvm-macos graalvm/graalvm-linux"
            compose: ""
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        working-directory: extended/window
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            extended/window
            .github/actions

      - name: This fork's Compose
        if: matrix.compose != ''
        uses: ./.github/actions/fork-compose
        with:
          targets: ${{ matrix.compose }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Publish to the local repository
        shell: bash
        run: |
          set -euo pipefail
          cp project.yaml project.yaml.all
          printf 'modules:\n' > project.yaml
          for m in ${{ matrix.modules }}; do printf '  - %s\n' "$m" >> project.yaml; done
          cat project.yaml
          ./kotlin publish mavenLocal
          cp project.yaml.all project.yaml

      - name: What was published
        shell: bash
        run: |
          find ~/.m2/repository/org/thisisthepy/compose/window -name '*.pom' -o -name '*.jar' -o -name '*.klib' -o -name '*.module' | sort
          test -n "$(find ~/.m2/repository/org/thisisthepy/compose/window -name '*.pom')"
