# The window modules published to the local Maven repository, the way compose-rust consumes
# them. Each runner publishes the modules it can build: the macOS one adds native/macos and
# the Ubuntu one adds native/linux. native/linux compiles against Compose for Kotlin/Native
# Linux, which JetBrains does not publish, so that runner builds those Compose modules from
# this checkout and publishes them to the local Maven repository first.
name: Extended window publish

on:
  workflow_dispatch:
  pull_request:
    paths:
      - extended/window/**
      - .github/workflows/extended-window-publish.yml
  push:
    branches:
      - extended
    paths:
      - extended/window/**
      - .github/workflows/extended-window-publish.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            modules: "common scene native/macos graalvm/graalvm-macos graalvm/graalvm-linux"
          - os: ubuntu-24.04
            modules: "common scene graalvm/graalvm-macos graalvm/graalvm-linux native/linux"
            compose_linux: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: extended/window
    env:
      COMPOSE_VERSION: 1.11.1-ext.1
      MATERIAL3_VERSION: 1.11.0-alpha07-ext.1
    steps:
      - uses: actions/checkout@v4
        if: ${{ !matrix.compose_linux }}
        with:
          sparse-checkout: extended/window

      - uses: actions/checkout@v4
        if: ${{ matrix.compose_linux }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Free disk space
        if: ${{ matrix.compose_linux }}
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /usr/local/julia* /opt/microsoft /opt/google
          df -h /

      - name: Install the X11, GL, fontconfig and FreeType development libraries
        if: ${{ matrix.compose_linux }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxext-dev libgl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev

      - uses: gradle/actions/setup-gradle@v4
        if: ${{ matrix.compose_linux }}
        with:
          gradle-home-cache-excludes: |
            caches/build-cache-1

      - name: Publish Compose for Kotlin/Native Linux from this checkout
        if: ${{ matrix.compose_linux }}
        working-directory: .
        env:
          ANDROIDX_JDK21: ${{ env.JAVA_HOME }}
        run: |
          set -euo pipefail
          mkdir -p ~/.gradle
          cat > ~/.gradle/gradle.properties <<EOF
          org.gradle.caching=false
          org.gradle.workers.max=4
          org.gradle.jvmargs=-Xmx11g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dlint.nullness.ignore-deprecated=true -Dfile.encoding=UTF-8
          kotlin.compiler.execution.strategy=in-process
          EOF
          tasks=()
          for module in animation:animation animation:animation-core foundation:foundation \
              foundation:foundation-layout material:material-ripple material3:material3 \
              ui:ui ui:ui-backhandler ui:ui-geometry ui:ui-graphics ui:ui-text \
              ui:ui-tooling-preview ui:ui-unit ui:ui-util; do
            for publication in LinuxX64 LinuxArm64 KotlinMultiplatform; do
              tasks+=(":compose:$module:publish${publication}PublicationToMavenLocal")
            done
          done
          ./gradlew --no-daemon --no-configuration-cache \
            -Pandroidx.enabled.kmp.target.platforms=-WINDOWS,-JS,-WASM \
            "-Pjetbrains.publication.version.COMPOSE=$COMPOSE_VERSION" \
            "-Pjetbrains.publication.version.COMPOSE_MATERIAL3=$MATERIAL3_VERSION" \
            "${tasks[@]}"

      - name: Which platforms the published Compose UI covers
        if: ${{ matrix.compose_linux }}
        working-directory: .
        run: |
          find ~/.m2/repository/org/jetbrains/compose/ui/ui -name '*.module' | head
          grep -h -o '"name": *"linux[A-Za-z0-9]*[A-Za-z]*"' $(find ~/.m2/repository/org/jetbrains/compose/ui/ui -name 'ui-*.module') | sort | uniq -c || true

      - name: Publish to the local repository
        shell: bash
        run: |
          set -euo pipefail
          cp project.yaml project.yaml.all
          printf 'modules:\n' > project.yaml
          for m in ${{ matrix.modules }}; do printf '  - %s\n' "$m" >> project.yaml; done
          cat project.yaml
          ./kotlin publish mavenLocal
          cp project.yaml.all project.yaml

      - name: What was published
        shell: bash
        run: |
          find ~/.m2/repository/org/thisisthepy/compose/window -name '*.pom' -o -name '*.jar' -o -name '*.klib' -o -name '*.module' | sort
          test -n "$(find ~/.m2/repository/org/thisisthepy/compose/window -name '*.pom')"

      - name: native-linux was published
        if: ${{ matrix.compose_linux }}
        shell: bash
        run: test -n "$(find ~/.m2/repository/org/thisisthepy/compose/window/native-linux* -name '*.pom')"
