# The window modules published to the local Maven repository, the way compose-rust consumes
# them. Each runner publishes the modules it can build: the macOS one adds native/macos and
# the Ubuntu one adds native/linux. Both compile against this fork's Compose, which nothing
# publishes, so each runner publishes it to the local Maven repository first
# (.github/actions/fork-compose).
name: Extended window publish

on:
  workflow_dispatch:
  pull_request:
    paths:
      - extended/window/**
      - .github/workflows/extended-window-publish.yml
      - .github/actions/fork-compose/**
      - extended/compose/**
  push:
    branches:
      - extended
    paths:
      - extended/window/**
      - .github/workflows/extended-window-publish.yml
      - .github/actions/fork-compose/**
      - extended/compose/**

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Retry transient dependency download failures (TLS handshake resets, timeouts) with
  # backoff. These are JVM system properties read by Gradle's repository transport, so
  # they must reach the daemon and Amper's JVMs; JAVA_TOOL_OPTIONS is inherited by all.
  JAVA_TOOL_OPTIONS: >-
    -Dorg.gradle.internal.repository.max.retries=6
    -Dorg.gradle.internal.repository.initial.backoff=1000
    -Dorg.gradle.internal.http.connectionTimeout=120000
    -Dorg.gradle.internal.http.socketTimeout=120000

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            modules: "common scene native/macos graalvm/graalvm-macos graalvm/graalvm-linux"
            compose: "desktop macosArm64"
          # The scene is published from macOS only: it compiles against this fork's Compose
          # for macosArm64 as well as the JVM, and only a Mac builds the former. The GraalVM
          # modules compile their window surfaces against it, so on Linux it is in the project
          # as a JVM module (scene_jvm_only) with its Linux targets, and what it publishes stays on this runner.
          - os: ubuntu-24.04
            modules: "common scene graalvm/graalvm-macos graalvm/graalvm-linux"
            compose: "desktop linuxX64 linuxArm64"
            compose_linux: true
            scene_jvm_only: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    defaults:
      run:
        working-directory: extended/window
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            extended/window
            .github/actions

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Free disk space
        if: ${{ matrix.compose_linux }}
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /opt/hostedtoolcache/CodeQL /usr/share/swift /usr/local/share/powershell \
            /usr/local/lib/node_modules /usr/local/julia* /opt/microsoft /opt/google
          df -h /

      - name: Install the X11, GL, fontconfig and FreeType development libraries
        if: ${{ matrix.compose_linux }}
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libx11-dev libxext-dev libgl1-mesa-dev \
            libfontconfig1-dev libfreetype6-dev

      - name: This fork's Compose
        uses: ./.github/actions/fork-compose
        with:
          targets: ${{ matrix.compose }}

      - name: The scene for this runner's platforms (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          perl -0pi -e 's/^  platforms: \[.*\]$/  platforms: [ jvm, macosArm64 ]/m' scene/module.yaml
          grep -q '^  platforms: \[ jvm, macosArm64 \]$' scene/module.yaml

      - name: The scene as a JVM and Linux module on this runner
        if: ${{ matrix.scene_jvm_only }}
        shell: bash
        run: |
          perl -0pi -e 's/^  platforms: \[.*\]$/  platforms: [ jvm, linuxX64, linuxArm64 ]/m' scene/module.yaml
          grep -q '^  platforms: \[ jvm, linuxX64, linuxArm64 \]$' scene/module.yaml

      - name: Publish to the local repository
        shell: bash
        run: |
          set -euo pipefail
          cp project.yaml project.yaml.all
          printf 'modules:\n' > project.yaml
          for m in ${{ matrix.modules }}; do printf '  - %s\n' "$m" >> project.yaml; done
          cat project.yaml
          ./kotlin publish mavenLocal
          cp project.yaml.all project.yaml

      - name: Publish native/linux and native/linux-scene, one architecture at a time
        if: ${{ matrix.compose_linux }}
        shell: bash
        run: ./scripts/publish-native-linux.sh

      - name: What was published
        shell: bash
        run: |
          find ~/.m2/repository/org/thisisthepy/compose/window -name '*.pom' -o -name '*.jar' -o -name '*.klib' -o -name '*.module' | sort
          test -n "$(find ~/.m2/repository/org/thisisthepy/compose/window -name '*.pom')"

      - name: What a consumer resolves for native-linux and native-linux-scene
        if: ${{ matrix.compose_linux }}
        shell: bash
        run: |
          set -euo pipefail
          base=~/.m2/repository/org/thisisthepy/compose/window
          for artifact in native-linux native-linux-scene; do
            for arch in linuxx64 linuxarm64; do
              dir="$base/$artifact-$arch/1.11.1-ext.2"
              for file in "$artifact-$arch-1.11.1-ext.2.klib" "$artifact-$arch-1.11.1-ext.2.module" "$artifact-$arch-1.11.1-ext.2.pom"; do
                test -s "$dir/$file" || { echo "missing $dir/$file" >&2; exit 1; }
              done
              echo "ok    $artifact-$arch is published as its own coordinate"
            done
            root="$base/$artifact/1.11.1-ext.2/$artifact-1.11.1-ext.2.module"
            test -s "$root" || { echo "missing the root module $root" >&2; exit 1; }
            cat "$root"
            for arch in linuxx64 linuxarm64; do
              grep -qi "$artifact-$arch" "$root" || { echo "the root module of $artifact does not list $arch" >&2; exit 1; }
            done
            echo "ok    the root module of $artifact lists both architectures"
          done
