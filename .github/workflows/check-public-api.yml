name: Check Public API
on:
  workflow_call: {}

env:
  # Retry transient dependency download failures (TLS handshake resets, timeouts) with
  # backoff. These are JVM system properties read by Gradle's repository transport, so
  # they must reach the daemon and Amper's JVMs; JAVA_TOOL_OPTIONS is inherited by all.
  JAVA_TOOL_OPTIONS: >-
    -Dorg.gradle.internal.repository.max.retries=6
    -Dorg.gradle.internal.repository.initial.backoff=1000
    -Dorg.gradle.internal.http.connectionTimeout=120000
    -Dorg.gradle.internal.http.socketTimeout=120000

jobs:
  check-public-api:
    runs-on: macos-15
    name: Check Public API
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Prerequisites
        uses: ./.github/actions/setup-prerequisites

      - name: Setup Xcode
        uses: ./.github/actions/setup-xcode

      # The fork compiles Compose for mingwX64 too, against a skiko that skiko does not publish
      # for it. Only the Kotlin half is needed to compile (and dump) a klib's API; it goes to the
      # local Maven repository, which the build reads skiko from first (buildSrc/repos.gradle).
      - name: skiko for mingwX64, the Kotlin half
        run: |
          ./extended/compose/retry-network.sh \
            ./extended/skiko/build-skiko-mingw.sh "$RUNNER_TEMP/skiko-mingw" --kotlin-only

      - name: Check Public API
        id: check
        run: |
          ./gradlew jbApiCheck \
            --no-daemon --stacktrace

      # What the dumps should be for this tree, so a change to the API (or to the targets a
      # module has) is fixed by applying the patch rather than by a local build of every target.
      - name: Write the dumps this tree gives
        if: failure() && steps.check.outcome == 'failure'
        run: |
          ./gradlew jbApiDump --no-daemon --stacktrace --continue || true
          git add -A -- ':(glob)**/api/**' ':(glob)**/bcv/**'
          git diff --cached --binary > "$RUNNER_TEMP/api-dumps.patch"
          git diff --cached --stat | tail -1

      - name: Upload the dumps
        if: failure() && steps.check.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: api-dumps
          path: ${{ runner.temp }}/api-dumps.patch
          if-no-files-found: ignore
