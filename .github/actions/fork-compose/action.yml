name: This fork's Compose in the local Maven repository
description: >-
  Publishes the Compose modules an application draws with, for the targets given, to
  ~/.m2/repository under org.thisisthepy.compose (extended/compose/publish-local.sh), or
  restores them from the cache when nothing that builds them has changed. The window modules
  and anything else built against this fork's Compose name those coordinates, and nothing on
  a public repository has them.

inputs:
  targets:
    description: >-
      Space separated targets for publish-local.sh (desktop, macosArm64, linuxX64, linuxArm64,
      mingwX64, iosArm64, iosSimulatorArm64, tvosArm64, tvosSimulatorArm64, watchosArm64,
      watchosArm32, watchosSimulatorArm64, js, wasmJs). With mingwX64 on macOS, skiko for it is
      built first (extended/skiko/build-skiko-mingw.sh) and the rest of the targets are published
      before it.
    required: true
  all-roots:
    description: >-
      'true' makes publish-local.sh configure JavaScript and Wasm too, so the roots it writes list
      the targets another runner builds.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    # The key is everything a Compose build reads: the whole tree except extended/ and .github/,
    # which hold the fork's own modules and CI, plus the publishing script. Trees, not files, so
    # a sparse checkout without blobs can work it out.
    - name: Work out what the Compose build reads
      id: key
      shell: bash
      run: |
        set -euo pipefail
        sources="$(git ls-tree HEAD | awk -F'\t' '$2 != "extended" && $2 != ".github" { print }' | git hash-object --stdin)"
        script="$(git rev-parse HEAD:extended/compose)"
        targets="$(echo '${{ inputs.targets }}' | tr ' ' '\n' | sort | paste -sd- -)"
        [[ '${{ inputs.all-roots }}' != true ]] || targets="$targets-roots"
        echo "key=fork-compose-${{ runner.os }}-${{ runner.arch }}-$targets-$sources-$script" >> "$GITHUB_OUTPUT"

    - name: Restore this fork's Compose
      id: restore
      uses: actions/cache/restore@v4
      with:
        path: ~/.m2/repository/org/thisisthepy/compose
        key: ${{ steps.key.outputs.key }}

    # The Compose build reads the whole tree; a restored cache needs only the checker.
    - name: Check out what the next steps read
      shell: bash
      run: |
        set -euo pipefail
        if [[ "$(git config --get core.sparseCheckout || true)" == "true" ]]; then
          if [[ '${{ steps.restore.outputs.cache-hit }}' == 'true' ]]; then
            git sparse-checkout add extended/compose
          else
            git sparse-checkout disable
          fi
        fi

    - uses: actions/setup-java@v4
      if: steps.restore.outputs.cache-hit != 'true'
      with:
        java-version: '21'
        distribution: 'corretto'

    - uses: gradle/actions/setup-gradle@v4
      if: steps.restore.outputs.cache-hit != 'true'
      with:
        cache-read-only: ${{ github.event_name == 'pull_request' }}

    - name: Configure Gradle for this runner
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      run: |
        set -euo pipefail
        echo "ANDROIDX_JDK21=$JAVA_HOME" >> "$GITHUB_ENV"
        # What the Linux job always built with. A macOS runner has half the memory and keeps
        # the build's own settings, as the foundation macOS job does.
        if [[ "$RUNNER_OS" == Linux ]]; then
          mkdir -p ~/.gradle
          cat >> ~/.gradle/gradle.properties <<PROPERTIES
        org.gradle.caching=false
        org.gradle.workers.max=4
        org.gradle.jvmargs=-Xmx11g -XX:MaxMetaspaceSize=2g -XX:+UseParallelGC -Dlint.nullness.ignore-deprecated=true -Dfile.encoding=UTF-8
        kotlin.compiler.execution.strategy=in-process
        PROPERTIES
        fi

    - name: Publish this fork's Compose
      if: steps.restore.outputs.cache-hit != 'true'
      shell: bash
      env:
        TARGETS: ${{ inputs.targets }}
        ALL_ROOTS: ${{ inputs.all-roots }}
        XWIN_VERSION: 0.6.5
      run: |
        set -euo pipefail
        export ANDROIDX_JDK21="$JAVA_HOME"
        roots=()
        [[ "$ALL_ROOTS" != true ]] || roots=(--all-roots)
        others=()
        mingw=0
        for target in $TARGETS; do
          if [[ "$target" == mingwX64 ]]; then mingw=1; else others+=("$target"); fi
        done
        if [[ ${#others[@]} -gt 0 ]]; then
          ./extended/compose/publish-local.sh ${roots[@]+"${roots[@]}"} "${others[@]}"
        fi
        if [[ $mingw -eq 1 ]]; then
          # skiko publishes no mingwX64 artifact. build-skiko-mingw.sh builds both halves, its
          # C++ half against the MSVC runtime and Windows SDK headers xwin lays out; the
          # Kotlin/Native toolchain it needs is there after the build above. The mingwX64
          # publication goes last, so the roots it writes list the Windows target as well, and
          # republish-skiko-mingw.py then points Compose's mingwX64 modules at skiko for it
          # (extended/publish-local-all.sh does the same on a Mac).
          [[ "$RUNNER_OS" == macOS ]] || { echo "::error::mingwX64 is published from macOS"; exit 1; }
          case "$(uname -m)" in arm64) triple=aarch64-apple-darwin ;; *) triple=x86_64-apple-darwin ;; esac
          curl -fsSL "https://github.com/Jake-Shadle/xwin/releases/download/$XWIN_VERSION/xwin-$XWIN_VERSION-$triple.tar.gz" |
            tar xz -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/xwin-$XWIN_VERSION-$triple/xwin" --accept-license \
            splat --output "$HOME/Library/Caches/cargo-xwin/xwin"
          ./extended/skiko/build-skiko-mingw.sh "$RUNNER_TEMP/skiko-mingw"
          ./extended/compose/publish-local.sh ${roots[@]+"${roots[@]}"} mingwX64
          version="$(sed -n 's/^jetbrains.publication.version.COMPOSE=//p' gradle.properties)"
          skiko_upstream="$(sed -n 's/^PUBLISHED_AS="\(.*\)"$/\1/p' extended/skiko/build-skiko-mingw.sh)"
          python3 extended/skiko/republish-skiko-mingw.py "$HOME/.m2/repository" "$skiko_upstream" "$version" \
            "$RUNNER_TEMP/skiko-mingw/out/windows-x64"
        fi

    - name: Check what is in the local repository
      shell: bash
      run: python3 -I extended/compose/check-local.py

    - name: Save this fork's Compose
      if: steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ~/.m2/repository/org/thisisthepy/compose
        key: ${{ steps.key.outputs.key }}
